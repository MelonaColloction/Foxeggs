name: Build Fox Eggs Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android
        uses: android-actions/setup-android@v3

      # -------------------------------
      # Prepare game
      # -------------------------------

      - name: Prepare game
        run: |
          test -f index.html
          mkdir -p www
          cp index.html www/index.html

      - name: Create package
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

          npm install

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      # -------------------------------
      # Version
      # -------------------------------

      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |

          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

      # -------------------------------
      # Keystore
      # -------------------------------

      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |

          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore

          test -s FoxEggs.keystore

          cp FoxEggs.keystore android/app/FoxEggs.keystore

          echo "Keystore loaded."

      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |

          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}

          EOF

      # -------------------------------
      # Create clean build.gradle
      # -------------------------------

      - name: Create clean Android build.gradle
        run: |

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.getcapacitor.android'
          }

          android {
              namespace "com.foxeggs.game"
              compileSdk 35

              defaultConfig {
                  applicationId "com.foxeggs.game"
                  minSdk 23
                  targetSdk 35

                  versionCode 101
                  versionName "1.0.1"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

                  aaptOptions {
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }

              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          repositories {
              flatDir {
                  dirs '../capacitor-cordova-android-plugins/src/main/libs'
              }
          }

          dependencies {
              implementation project(':capacitor-android')
              implementation project(':capacitor-cordova-android-plugins')

              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core-ktx:1.15.0'
          }

          apply from: 'capacitor.build.gradle'
          EOF

          # Replace version values with current build number
          python3 - <<'PY'

          import os

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = text.replace(
              "versionCode 101",
              "versionCode " + os.environ["VERSION_CODE"]
          )

          text = text.replace(
              'versionName "1.0.1"',
              'versionName "' + os.environ["VERSION_NAME"] + '"'
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          PY

          echo "Clean build.gradle created."

      # -------------------------------
      # Remove unnecessary permissions
      # -------------------------------

      - name: Clean permissions
        run: |

          python3 - <<'PY'

          import re

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          bad_permissions = [
              "READ_CONTACTS",
              "WRITE_CONTACTS",
              "READ_SMS",
              "SEND_SMS",
              "RECEIVE_SMS",
              "CALL_PHONE",
              "READ_PHONE_STATE",
              "ACCESS_FINE_LOCATION",
              "ACCESS_COARSE_LOCATION",
              "CAMERA",
              "RECORD_AUDIO",
              "READ_EXTERNAL_STORAGE",
              "WRITE_EXTERNAL_STORAGE",
              "MANAGE_EXTERNAL_STORAGE",
              "REQUEST_INSTALL_PACKAGES",
              "SYSTEM_ALERT_WINDOW",
              "BIND_ACCESSIBILITY_SERVICE"
          ]

          for permission in bad_permissions:

              text = re.sub(
                  r'\s*<uses-permission\s+android:name="android\.permission\.'
                  + permission +
                  r'"\s*/>',
                  '',
                  text
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          PY

      # -------------------------------
      # Icon
      # -------------------------------

      - name: Install Pillow
        run: |
          python3 -m pip install pillow

      - name: Create Fox Eggs icon
        run: |

          cat > create_icon.py <<'PY'

          from PIL import Image, ImageDraw

          S = 1024

          img = Image.new(
              "RGBA",
              (S, S),
              (255, 190, 70, 255)
          )

          d = ImageDraw.Draw(img)

          # Background
          d.rounded_rectangle(
              (30, 30, 994, 994),
              radius=190,
              fill=(255, 184, 70, 255)
          )

          # Fox
          d.polygon(
              [
                  (150,350),
                  (190,135),
                  (365,245),
                  (512,205),
                  (659,245),
                  (834,135),
                  (874,350),
                  (825,610),
                  (700,770),
                  (512,830),
                  (324,770),
                  (199,610)
              ],
              fill=(215,91,42,255)
          )

          # Inner ears
          d.polygon(
              [(205,300),(215,185),(345,275)],
              fill=(255,145,115,255)
          )

          d.polygon(
              [(679,275),(809,185),(819,300)],
              fill=(255,145,115,255)
          )

          # Face
          d.polygon(
              [
                  (512,400),
                  (430,455),
                  (390,590),
                  (425,700),
                  (512,755),
                  (599,700),
                  (634,590),
                  (594,455)
              ],
              fill=(255,239,211,255)
          )

          # Eyes
          d.ellipse(
              (330,430,410,520),
              fill=(35,25,20,255)
          )

          d.ellipse(
              (614,430,694,520),
              fill=(35,25,20,255)
          )

          d.ellipse(
              (350,447,375,472),
              fill=(255,255,255,255)
          )

          d.ellipse(
              (634,447,659,472),
              fill=(255,255,255,255)
          )

          # Nose
          d.ellipse(
              (468,555,556,625),
              fill=(40,25,22,255)
          )

          # Egg
          egg = [
              (760,455),
              (735,480),
              (720,530),
              (725,600),
              (745,680),
              (780,755),
              (825,805),
              (870,775),
              (900,710),
              (920,625),
              (918,550),
              (900,490),
              (870,455),
              (815,435)
          ]

          d.polygon(
              egg,
              fill=(255,250,232,255)
          )

          # Egg spots
          d.ellipse(
              (760,535,805,580),
              fill=(235,115,55,255)
          )

          d.ellipse(
              (830,620,875,665),
              fill=(235,115,55,255)
          )

          d.ellipse(
              (785,700,825,740),
              fill=(235,115,55,255)
          )

          img.save(
              "fox-eggs-icon.png",
              "PNG"
          )

          PY

          python3 create_icon.py

      - name: Generate Android icons
        run: |

          python3 - <<'PY'

          from PIL import Image
          import os

          source = Image.open(
              "fox-eggs-icon.png"
          ).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():

              folder = (
                  "android/app/src/main/res/mipmap-"
                  + density
              )

              os.makedirs(
                  folder,
                  exist_ok=True
              )

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  folder + "/ic_launcher.png"
              )

              icon.save(
                  folder + "/ic_launcher_round.png"
              )

          PY

      - name: Remove adaptive defaults
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      # -------------------------------
      # Build
      # -------------------------------

      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --no-daemon

      - name: Inspect APK
        run: |

          APK="android/app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          echo "=============================="
          echo "FOX EGGS APK"
          echo "=============================="

          echo ""
          echo "FILE:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "PACKAGE / VERSION:"
          "$AAPT" dump badging "$APK" | head -n 15

          echo ""
          echo "PERMISSIONS:"
          "$AAPT" dump permissions "$APK"

          echo ""
          echo "SIGNATURE:"
          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      # -------------------------------
      # AAB
      # -------------------------------

      - name: Build AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon

      # -------------------------------
      # Release
      # -------------------------------

      - name: Prepare release
        run: |

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/FoxEggs.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/FoxEggs.aab

          cp \
            fox-eggs-icon.png \
            release/FoxEggs-Icon.png

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-Release
          path: release/

      # -------------------------------
      # Cleanup
      # -------------------------------

      - name: Cleanup
        if: always()
        run: |
          rm -f FoxEggs.keystore
          rm -f android/app/FoxEggs.keystore
