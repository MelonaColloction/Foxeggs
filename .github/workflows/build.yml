name: Build Fox Eggs Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Fox Eggs Release
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # =========================
      # Java 21
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # =========================
      # Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================
      # Check game
      # =========================
      - name: Check index.html
        run: |
          test -f index.html


      # =========================
      # Prepare web files
      # =========================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html


      # =========================
      # package.json
      # =========================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm install


      # =========================
      # Capacitor config
      # =========================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www"
          }
          EOF


      # =========================
      # Add Android
      # =========================
      - name: Add Android
        run: npx cap add android


      # =========================
      # Sync Android
      # =========================
      - name: Sync Android
        run: npx cap sync android


      # =========================
      # Install Python image library
      # =========================
      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow


      # =========================
      # Generate Fox Eggs icon
      # =========================
      - name: Generate Fox Eggs icon
        run: |

          cat > generate_icon.py <<'PY'
          from PIL import Image, ImageDraw

          SIZE = 1024

          img = Image.new("RGBA", (SIZE, SIZE), (255, 190, 70, 255))
          draw = ImageDraw.Draw(img)

          # Background circle
          draw.ellipse(
              (70, 70, 954, 954),
              fill=(255, 205, 90, 255)
          )

          # Fox ears
          draw.polygon(
              [(245, 330), (330, 145), (455, 320)],
              fill=(190, 85, 45, 255)
          )

          draw.polygon(
              [(569, 320), (694, 145), (779, 330)],
              fill=(190, 85, 45, 255)
          )

          # Inner ears
          draw.polygon(
              [(285, 285), (330, 195), (395, 295)],
              fill=(255, 160, 125, 255)
          )

          draw.polygon(
              [(629, 295), (694, 195), (739, 285)],
              fill=(255, 160, 125, 255)
          )

          # Egg
          egg = [
              (512, 230),
              (420, 245),
              (350, 300),
              (315, 400),
              (320, 540),
              (370, 680),
              (450, 785),
              (512, 825),
              (574, 785),
              (654, 680),
              (704, 540),
              (709, 400),
              (674, 300),
              (604, 245)
          ]

          draw.polygon(
              egg,
              fill=(255, 248, 220, 255)
          )

          # Egg colored spots
          draw.ellipse(
              (390, 350, 470, 430),
              fill=(245, 135, 65, 255)
          )

          draw.ellipse(
              (570, 430, 650, 510),
              fill=(245, 135, 65, 255)
          )

          draw.ellipse(
              (430, 570, 505, 645),
              fill=(245, 135, 65, 255)
          )

          # Fox eyes
          draw.ellipse(
              (400, 470, 455, 535),
              fill=(40, 30, 25, 255)
          )

          draw.ellipse(
              (569, 470, 624, 535),
              fill=(40, 30, 25, 255)
          )

          # Nose
          draw.ellipse(
              (478, 535, 546, 590),
              fill=(40, 30, 25, 255)
          )

          # Smile
          draw.arc(
              (445, 545, 579, 650),
              15,
              165,
              fill=(40, 30, 25, 255),
              width=10
          )

          # Save
          img.save("fox-eggs-icon.png")

          print("Fox Eggs icon generated.")
          PY

          python3 generate_icon.py


      # =========================
      # Generate Android icon sizes
      # =========================
      - name: Generate Android icon sizes
        run: |

          python3 - <<'PY'

          from PIL import Image
          import os

          source = Image.open("fox-eggs-icon.png").convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          base = "android/app/src/main/res"

          for density, size in sizes.items():

              folder = os.path.join(base, f"mipmap-{density}")

              os.makedirs(folder, exist_ok=True)

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  os.path.join(folder, "ic_launcher.png"),
                  "PNG"
              )

              icon.save(
                  os.path.join(folder, "ic_launcher_round.png"),
                  "PNG"
              )

          PY


      # =========================
      # Set Android icon
      # =========================
      - name: Configure Android icon
        run: |

          python3 - <<'PY'

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r") as f:
              text = f.read()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )

          text = text.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@mipmap/ic_launcher_round"'
          )

          with open(path, "w") as f:
              f.write(text)

          PY


      # =========================
      # Version
      # =========================
      - name: Set Android version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |

          VERSION_CODE=$((RUN_NUMBER + 100))

          python3 - <<PY

          path = "android/app/build.gradle"

          with open(path, "r") as f:
              text = f.read()

          text = text.replace(
              "versionCode 1",
              "versionCode ${VERSION_CODE}"
          )

          text = text.replace(
              'versionName "1.0.0"',
              'versionName "1.0.${RUN_NUMBER}"'
          )

          with open(path, "w") as f:
              f.write(text)

          PY


      # =========================
      # Decode Keystore
      # =========================
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |

          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore

          test -s FoxEggs.keystore


      # =========================
      # Copy Keystore
      # =========================
      - name: Copy Keystore
        run: |

          cp FoxEggs.keystore \
             android/app/FoxEggs.keystore


      # =========================
      # Configure signing
      # =========================
      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |

          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          EOF


      # =========================
      # Configure Release
      # =========================
      - name: Configure Release signing
        run: |

          python3 - <<'PY'

          path = "android/app/build.gradle"

          with open(path, "r") as f:
              text = f.read()

          signing = """
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                  }
              }
          """

          if "signingConfigs {" not in text:

              text = text.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          text = text.replace(
              "buildTypes {",
              """buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              """,
              1
          )

          with open(path, "w") as f:
              f.write(text)

          PY


      # =========================
      # Build APK
      # =========================
      - name: Build Release APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --no-daemon


      # =========================
      # Build AAB
      # =========================
      - name: Build Release AAB
        working-directory: android
        run: |

          ./gradlew bundleRelease --no-daemon


      # =========================
      # Prepare files
      # =========================
      - name: Prepare release
        run: |

          mkdir -p release

          cp android/app/build/outputs/apk/release/app-release.apk \
             release/FoxEggs.apk

          cp android/app/build/outputs/bundle/release/app-release.aab \
             release/FoxEggs.aab


      # =========================
      # Upload
      # =========================
      - name: Upload Fox Eggs Release
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-Release
          path: release/
          if-no-files-found: error


      # =========================
      # Cleanup
      # =========================
      - name: Cleanup
        if: always()
        run: |

          rm -f FoxEggs.keystore
          rm -f android/app/FoxEggs.keystore
