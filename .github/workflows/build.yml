name: Build Fox Eggs APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Fox Eggs
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # =========================
      # Java 21
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # =========================
      # Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================
      # آماده کردن بازی
      # =========================
      - name: Prepare web
        run: |
          mkdir -p www
          cp index.html www/index.html


      # =========================
      # package.json
      # =========================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


      # =========================
      # نصب Capacitor
      # =========================
      - name: Install Capacitor
        run: npm install


      # =========================
      # Capacitor config
      # =========================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www"
          }
          EOF


      # =========================
      # Android
      # =========================
      - name: Add Android
        run: npx cap add android


      # =========================
      # Sync
      # =========================
      - name: Sync
        run: npx cap sync android


      # =========================
      # ImageMagick
      # =========================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # =========================
      # ساخت آیکن
      # =========================
      - name: Create icon
        run: |

          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1024"
               height="1024"
               viewBox="0 0 1024 1024">

            <!-- Background -->
            <rect
              width="1024"
              height="1024"
              rx="220"
              fill="#FF8A00"/>

            <!-- Egg -->
            <path
              d="M720 760
                 C860 760 920 610 890 460
                 C860 310 790 190 720 190
                 C650 190 580 310 550 460
                 C520 610 580 760 720 760Z"
              fill="#FFFFFF"/>

            <!-- Egg stripe -->
            <path
              d="M555 470
                 Q720 390 885 470
                 L885 560
                 Q720 640 555 560Z"
              fill="#FFD43B"/>

            <!-- Fox tail -->
            <path
              d="M170 690
                 C40 600 80 430 230 460
                 C330 480 350 590 260 650
                 C230 670 200 685 170 690Z"
              fill="#E85D04"/>

            <!-- Tail -->
            <path
              d="M105 470
                 C60 530 85 610 145 625
                 C185 635 205 600 205 575
                 C150 555 125 515 105 470Z"
              fill="#FFF3E0"/>

            <!-- Body -->
            <ellipse
              cx="390"
              cy="630"
              rx="200"
              ry="130"
              fill="#F76707"/>

            <!-- Belly -->
            <ellipse
              cx="430"
              cy="650"
              rx="100"
              ry="75"
              fill="#FFF3E0"/>

            <!-- Head -->
            <ellipse
              cx="470"
              cy="410"
              rx="155"
              ry="140"
              fill="#FF7A00"/>

            <!-- Left ear -->
            <path
              d="M350 340
                 L335 140
                 L465 270Z"
              fill="#E85D04"/>

            <!-- Right ear -->
            <path
              d="M500 270
                 L625 140
                 L600 350Z"
              fill="#E85D04"/>

            <!-- Inner ears -->
            <path
              d="M370 300 L360 190 L430 270Z"
              fill="#FFB3B3"/>

            <path
              d="M525 270 L600 190 L580 310Z"
              fill="#FFB3B3"/>

            <!-- Face -->
            <ellipse
              cx="525"
              cy="455"
              rx="110"
              ry="80"
              fill="#FFF3E0"/>

            <!-- Eyes -->
            <circle
              cx="425"
              cy="395"
              r="20"
              fill="#111111"/>

            <circle
              cx="535"
              cy="395"
              r="20"
              fill="#111111"/>

            <!-- Eye shine -->
            <circle
              cx="432"
              cy="388"
              r="7"
              fill="white"/>

            <circle
              cx="542"
              cy="388"
              r="7"
              fill="white"/>

            <!-- Nose -->
            <circle
              cx="555"
              cy="455"
              r="13"
              fill="#111111"/>

            <!-- Smile -->
            <path
              d="M555 470 Q540 505 510 485"
              fill="none"
              stroke="#111111"
              stroke-width="10"
              stroke-linecap="round"/>

          </svg>
          EOF


      # =========================
      # تبدیل SVG به PNG
      # =========================
      - name: Convert icon
        run: |
          convert -background none icon.svg icon.png


      # =========================
      # حذف آیکن‌های قبلی
      # =========================
      - name: Remove default icons
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable/ic_launcher*
          rm -rf android/app/src/main/res/drawable/ic_launcher_foreground*


      # =========================
      # ساخت پوشه‌ها
      # =========================
      - name: Create icon folders
        run: |

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26


      # =========================
      # PNG های آیکن
      # =========================
      - name: Generate PNG icons
        run: |

          convert icon.png -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert icon.png -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert icon.png -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert icon.png -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert icon.png -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png


          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png


      # =========================
      # Adaptive Icon
      # =========================
      - name: Create adaptive icon
        run: |

          cat > android/app/src/main/res/values.xml <<'EOF'
          EOF

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="fox_orange">#FF8A00</color>
          </resources>
          EOF


          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/fox_orange"/>
              <foreground android:drawable="@drawable/fox_icon_foreground"/>
          </adaptive-icon>
          EOF


          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/fox_orange"/>
              <foreground android:drawable="@drawable/fox_icon_foreground"/>
          </adaptive-icon>
          EOF


      # =========================
      # foreground
      # =========================
      - name: Create foreground
        run: |

          mkdir -p android/app/src/main/res/drawable

          convert icon.png \
            -resize 432x432 \
            android/app/src/main/res/drawable/fox_icon_foreground.png


      # =========================
      # تنظیم Manifest
      # =========================
      - name: Set launcher icon
        run: |

          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r") as f:
              text = f.read()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )

          text = text.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@mipmap/ic_launcher_round"'
          )

          with open(path, "w") as f:
              f.write(text)
          PY


      # =========================
      # Build
      # =========================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon


      # =========================
      # خروجی
      # =========================
      - name: Prepare APK
        run: |

          mkdir -p release

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/FoxEggs.apk


      # =========================
      # Upload
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-APK
          path: release/FoxEggs.apk
          if-no-files-found: error
