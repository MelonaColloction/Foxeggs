name: Build Fox Eggs Android

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:  

  # =========================================  
  # Checkout  
  # =========================================  

  - name: Checkout  
    uses: actions/checkout@v4  


  # =========================================  
  # Node.js  
  # =========================================  

  - name: Setup Node.js  
    uses: actions/setup-node@v4  
    with:  
      node-version: 20  


  # =========================================  
  # Java  
  # =========================================  

  - name: Setup Java  
    uses: actions/setup-java@v4  
    with:  
      distribution: temurin  
      java-version: 21  


  # =========================================  
  # Android SDK  
  # =========================================  

  - name: Setup Android SDK  
    uses: android-actions/setup-android@v3  


  # =========================================  
  # Prepare game  
  # =========================================  

  - name: Prepare game  
    run: |  
      test -f index.html  

      rm -rf www  
      mkdir -p www  

      cp index.html www/index.html  


  # =========================================  
  # package.json  
  # =========================================  

  - name: Create package.json  
    run: |  
      cat > package.json <<'EOF'  
      {  
        "name": "fox-eggs",  
        "version": "1.0.0",  
        "private": true,  
        "dependencies": {  
          "@capacitor/core": "^7.4.0",  
          "@capacitor/android": "^7.4.0"  
        },  
        "devDependencies": {  
          "@capacitor/cli": "^7.4.0"  
        }  
      }  
      EOF  


  # =========================================  
  # Install Capacitor  
  # =========================================  

  - name: Install dependencies  
    run: |  
      npm install  


  # =========================================  
  # Capacitor configuration  
  # =========================================  

  - name: Create Capacitor config  
    run: |  
      cat > capacitor.config.json <<'EOF'  
      {  
        "appId": "com.foxeggs.game",  
        "appName": "Fox Eggs",  
        "webDir": "www"  
      }  
      EOF  


  # =========================================  
  # Create Android project  
  # =========================================  

  - name: Add Android  
    run: |  
      npx cap add android  


  - name: Sync Android  
    run: |  
      npx cap sync android  


  # =========================================  
  # Version  
  # =========================================  

  - name: Set version  
    env:  
      RUN_NUMBER: ${{ github.run_number }}  
    run: |  

      VERSION_CODE=$((RUN_NUMBER + 100))  
      VERSION_NAME="1.0.${RUN_NUMBER}"  

      echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"  
      echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"  

      echo "Version Code: $VERSION_CODE"  
      echo "Version Name: $VERSION_NAME"  


  # =========================================  
  # Load SAME KEYSTORE  
  # =========================================  

  - name: Load existing keystore  
    env:  
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}  
    run: |  

      echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore  

      test -s FoxEggs.keystore  

      cp FoxEggs.keystore android/app/FoxEggs.keystore  

      echo "Keystore loaded successfully."  


  # =========================================  
  # Configure signing properties  
  # =========================================  

  - name: Configure signing properties  
    env:  
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}  
    run: |  

      cat >> android/gradle.properties <<EOF  

      FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore  
      FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}  
      FOXEGGS_KEY_ALIAS=foxeggs  
      FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}  

      EOF  


  # =========================================  
  # Configure Capacitor generated Gradle  
  # =========================================  

  - name: Configure Android Gradle  
    run: |  

      python3 - <<'PY'  

      import re  
      import os  

      path = "android/app/build.gradle"  

      with open(path, "r", encoding="utf-8") as f:  
          text = f.read()  


      # -----------------------------------------  
      # Application ID  
      # -----------------------------------------  

      text = re.sub(  
          r'applicationId\s+"[^"]+"',  
          'applicationId "com.foxeggs.game"',  
          text,  
          count=1  
      )  


      # -----------------------------------------  
      # Compile SDK  
      # -----------------------------------------  

      text = re.sub(  
          r'compileSdk\s+[^\n]+',  
          'compileSdk 35',  
          text,  
          count=1  
      )  


      # -----------------------------------------  
      # Version Code  
      # -----------------------------------------  

      text = re.sub(  
          r'versionCode\s+\d+',  
          'versionCode ' + os.environ["VERSION_CODE"],  
          text,  
          count=1  
      )  


      # -----------------------------------------  
      # Version Name  
      # -----------------------------------------  

      text = re.sub(  
          r'versionName\s+"[^"]+"',  
          'versionName "' + os.environ["VERSION_NAME"] + '"',  
          text,  
          count=1  
      )  


      # -----------------------------------------  
      # Remove old signingConfigs if present  
      # -----------------------------------------  

      text = re.sub(  
          r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)',  
          '',  
          text,  
          flags=re.S  
      )  


      # -----------------------------------------  
      # Add signingConfigs BEFORE buildTypes  
      # -----------------------------------------  

      signing_block = '''  
          signingConfigs {  
              release {  
                  storeFile file(FOXEGGS_KEYSTORE_FILE)  
                  storePassword FOXEGGS_KEYSTORE_PASSWORD  
                  keyAlias FOXEGGS_KEY_ALIAS  
                  keyPassword FOXEGGS_KEY_PASSWORD  
                  v1SigningEnabled true  
                  v2SigningEnabled true  
              }  
          }  

      '''  


      if "signingConfigs {" not in text:  

          text = text.replace(  
              "    buildTypes {",  
              signing_block + "    buildTypes {",  
              1  
          )  


      # -----------------------------------------  
      # Add signingConfig ONLY inside  
      # buildTypes -> release  
      # -----------------------------------------  

      pattern = (  
          r'(buildTypes\s*\{\s*'  
          r'release\s*\{)'  
      )  

      replacement = (  
          r'\1\n'  
          r'            signingConfig signingConfigs.release'  
      )  

      if "signingConfig signingConfigs.release" not in text:  

          text = re.sub(  
              pattern,  
              replacement,  
              text,  
              count=1,  
              flags=re.S  
          )  


      # -----------------------------------------  
      # Disable minification  
      # -----------------------------------------  

      if "minifyEnabled" in text:  

          text = re.sub(  
              r'minifyEnabled\s+\w+',  
              'minifyEnabled false',  
              text,  
              count=1  
          )  

      else:  

          text = text.replace(  
              "release {",  
              "release {\n            minifyEnabled false",  
              1  
          )  


      with open(path, "w", encoding="utf-8") as f:  
          f.write(text)  


      print("Android Gradle configured successfully.")  

      PY  


  # =========================================  
  # Show final Gradle file  
  # =========================================  

  - name: Show Gradle configuration  
    run: |  

      echo "=========================================="  
      echo "FINAL ANDROID BUILD.GRADLE"  
      echo "=========================================="  

      cat android/app/build.gradle  


  # =========================================  
  # Remove unnecessary permissions  
  # =========================================  

  - name: Clean unnecessary permissions  
    run: |  

      python3 - <<'PY'  

      import re  

      path = "android/app/src/main/AndroidManifest.xml"  

      with open(path, "r", encoding="utf-8") as f:  
          text = f.read()  


      permissions = [  
          "READ_CONTACTS",  
          "WRITE_CONTACTS",  
          "READ_SMS",  
          "SEND_SMS",  
          "RECEIVE_SMS",  
          "CALL_PHONE",  
          "READ_PHONE_STATE",  
          "ACCESS_FINE_LOCATION",  
          "ACCESS_COARSE_LOCATION",  
          "CAMERA",  
          "RECORD_AUDIO",  
          "READ_EXTERNAL_STORAGE",  
          "WRITE_EXTERNAL_STORAGE",  
          "MANAGE_EXTERNAL_STORAGE",  
          "REQUEST_INSTALL_PACKAGES",  
          "SYSTEM_ALERT_WINDOW",  
          "BIND_ACCESSIBILITY_SERVICE"  
      ]  


      for permission in permissions:  

          pattern = (  
              r'\s*<uses-permission\s+'  
              r'android:name="android\.permission\.'  
              + permission +  
              r'"\s*/>'  
          )  

          text = re.sub(  
              pattern,  
              '',  
              text  
          )  


      with open(path, "w", encoding="utf-8") as f:  
          f.write(text)  


      print("Unnecessary permissions removed.")  

      PY  


  # =========================================  
  # Pillow  
  # =========================================  

  - name: Install Pillow  
    run: |  
      python3 -m pip install pillow  


  # =========================================  
  # Create Fox + Egg icon  
  # =========================================  

  - name: Create Fox Eggs icon  
    run: |  

      cat > create_icon.py <<'PY'  

      from PIL import Image, ImageDraw  

      S = 1024  

      img = Image.new(  
          "RGBA",  
          (S, S),  
          (255, 190, 70, 255)  
      )  

      d = ImageDraw.Draw(img)  


      # Background  
      d.rounded_rectangle(  
          (30, 30, 994, 994),  
          radius=190,  
          fill=(255, 184, 70, 255)  
      )  


      # Fox head  
      d.polygon(  
          [  
              (150,350),  
              (190,135),  
              (365,245),  
              (512,205),  
              (659,245),  
              (834,135),  
              (874,350),  
              (825,610),  
              (700,770),  
              (512,830),  
              (324,770),  
              (199,610)  
          ],  
          fill=(215,91,42,255)  
      )  


      # Inner ears  
      d.polygon(  
          [  
              (205,300),  
              (215,185),  
              (345,275)  
          ],  
          fill=(255,145,115,255)  
      )  

      d.polygon(  
          [  
              (679,275),  
              (809,185),  
              (819,300)  
          ],  
          fill=(255,145,115,255)  
      )  


      # Face  
      d.polygon(  
          [  
              (512,400),  
              (430,455),  
              (390,590),  
              (425,700),  
              (512,755),  
              (599,700),  
              (634,590),  
              (594,455)  
          ],  
          fill=(255,239,211,255)  
      )  


      # Eyes  
      d.ellipse(  
          (330,430,410,520),  
          fill=(35,25,20,255)  
      )  

      d.ellipse(  
          (614,430,694,520),  
          fill=(35,25,20,255)  
      )  


      # Eye highlights  
      d.ellipse(  
          (350,447,375,472),  
          fill=(255,255,255,255)  
      )  

      d.ellipse(  
          (634,447,659,472),  
          fill=(255,255,255,255)  
      )  


      # Nose  
      d.ellipse(  
          (468,555,556,625),  
          fill=(40,25,22,255)  
      )  


      # Egg  
      egg = [  
          (760,455),  
          (735,480),  
          (720,530),  
          (725,600),  
          (745,680),  
          (780,755),  
          (825,805),  
          (870,775),  
          (900,710),  
          (920,625),  
          (918,550),  
          (900,490),  
          (870,455),  
          (815,435)  
      ]  

      d.polygon(  
          egg,  
          fill=(255,250,232,255)  
      )  


      # Egg spots  
      d.ellipse(  
          (760,535,805,580),  
          fill=(235,115,55,255)  
      )  

      d.ellipse(  
          (830,620,875,665),  
          fill=(235,115,55,255)  
      )  

      d.ellipse(  
          (785,700,825,740),  
          fill=(235,115,55,255)  
      )  


      img.save(  
          "fox-eggs-icon.png",  
          "PNG"  
      )  


      print("Fox Eggs icon created.")  

      PY  

      python3 create_icon.py  


  # =========================================  
  # Generate Android icon sizes  
  # =========================================  

  - name: Generate Android icons  
    run: |  

      python3 - <<'PY'  

      from PIL import Image  
      import os  


      source = Image.open(  
          "fox-eggs-icon.png"  
      ).convert("RGBA")  


      sizes = {  
          "mdpi": 48,  
          "hdpi": 72,  
          "xhdpi": 96,  
          "xxhdpi": 144,  
          "xxxhdpi": 192  
      }  


      for density, size in sizes.items():  

          folder = (  
              "android/app/src/main/res/mipmap-"  
              + density  
          )  

          os.makedirs(  
              folder,  
              exist_ok=True  
          )  


          icon = source.resize(  
              (size, size),  
              Image.Resampling.LANCZOS  
          )  


          icon.save(  
              folder + "/ic_launcher.png"  
          )  

          icon.save(  
              folder + "/ic_launcher_round.png"  
          )  


      print("Android icons generated.")  

      PY  


  # =========================================  
  # Remove adaptive icon XML  
  # =========================================  

  - name: Remove adaptive icon defaults  
    run: |  

      rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml  

      rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml  


  # =========================================  
  # Verify package and signing  
  # =========================================  

  - name: Verify configuration  
    run: |  

      echo "=========================================="  
      echo "FOX EGGS CONFIGURATION"  
      echo "=========================================="  

      echo ""  
      echo "APPLICATION ID:"  
      grep "applicationId" android/app/build.gradle  

      echo ""  
      echo "VERSION:"  
      grep "versionCode" android/app/build.gradle  
      grep "versionName" android/app/build.gradle  

      echo ""  
      echo "COMPILE SDK:"  
      grep "compileSdk" android/app/build.gradle  

      echo ""  
      echo "SIGNING:"  
      grep -A10 "signingConfigs" android/app/build.gradle  


  # =========================================  
  # Build APK  
  # =========================================  

  - name: Build Release APK  
    working-directory: android  
    run: |  

      chmod +x gradlew  

      ./gradlew clean  

      ./gradlew assembleRelease --no-daemon  


  # =========================================  
  # Inspect APK  
  # =========================================  

  - name: Inspect APK  
    run: |  

      APK="android/app/build/outputs/apk/release/app-release.apk"  

      BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)  

      AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"  

      APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"  


      echo "=========================================="  
      echo "FOX EGGS APK"  
      echo "=========================================="  


      echo ""  
      echo "APK FILE:"  
      ls -lh "$APK"  


      echo ""  
      echo "SHA256:"  
      sha256sum "$APK"  


      echo ""  
      echo "PACKAGE / VERSION:"  
      "$AAPT" dump badging "$APK" | head -n 20  


      echo ""  
      echo "PERMISSIONS:"  
      "$AAPT" dump permissions "$APK"  


      echo ""  
      echo "SIGNATURE:"  
      "$APKSIGNER" verify \  
        --verbose \  
        --print-certs \  
        "$APK"  


  # =========================================  
  # Build AAB  
  # =========================================  

  - name: Build Release AAB  
    working-directory: android  
    run: |  

      ./gradlew bundleRelease --no-daemon  


  # =========================================  
  # Prepare release files  
  # =========================================  

  - name: Prepare release  
    run: |  

      mkdir -p release  


      cp \  
        android/app/build/outputs/apk/release/app-release.apk \  
        release/FoxEggs.apk  


      cp \  
        android/app/build/outputs/bundle/release/app-release.aab \  
        release/FoxEggs.aab  


      cp \  
        fox-eggs-icon.png \  
        release/FoxEggs-Icon.png  


  # =========================================  
  # Upload  
  # =========================================  

  - name: Upload Fox Eggs Release  
    uses: actions/upload-artifact@v4  
    with:  
      name: FoxEggs-Release  
      path: release/  
      if-no-files-found: error  


  # =========================================  
  # Cleanup  
  # =========================================  

  - name: Cleanup  
    if: always()  
    run: |  

      rm -f FoxEggs.keystore  

      rm -f android/app/FoxEggs.keystore
