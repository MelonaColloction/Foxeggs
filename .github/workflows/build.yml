name: Build Fox Eggs Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Fox Eggs Release
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # Node
      # ========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ========================================
      # Java
      # ========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ========================================
      # Android SDK
      # ========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ========================================
      # Check game
      # ========================================

      - name: Check game
        run: |
          test -f index.html
          echo "Fox Eggs found."


      # ========================================
      # Web files
      # ========================================

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html


      # ========================================
      # package.json
      # ========================================

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


      # ========================================
      # Install
      # ========================================

      - name: Install dependencies
        run: |
          npm install


      # ========================================
      # Capacitor
      # ========================================

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www"
          }
          EOF


      - name: Add Android
        run: |
          npx cap add android


      - name: Sync Android
        run: |
          npx cap sync android


      # ========================================
      # Android configuration
      # ========================================

      - name: Configure Android
        run: |

          python3 - <<'PY'

          import re

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove any existing signing block created by previous scripts
          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=buildTypes)',
              '\n',
              text,
              flags=re.S
          )

          # Ensure compile SDK
          if "compileSdk" in text:
              text = re.sub(
                  r'compileSdk\s+.*',
                  'compileSdk 35',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  'android {',
                  'android {\n    compileSdk 35',
                  1
              )

          # Ensure min SDK
          if "minSdkVersion" in text:
              text = re.sub(
                  r'minSdkVersion\s+.*',
                  'minSdkVersion 23',
                  text,
                  count=1
              )

          # Ensure target SDK
          if "targetSdkVersion" in text:
              text = re.sub(
                  r'targetSdkVersion\s+.*',
                  'targetSdkVersion 35',
                  text,
                  count=1
              )

          # Ensure application ID
          text = re.sub(
              r'applicationId\s+"[^"]+"',
              'applicationId "com.foxeggs.game"',
              text,
              count=1
          )

          # Ensure version
          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 1',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.0.0"',
              text,
              count=1
          )

          # Add signing config before buildTypes
          signing = '''
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

          '''

          text = text.replace(
              '    buildTypes {',
              signing + '    buildTypes {',
              1
          )

          # Add signing to release build type
          text = text.replace(
              '        release {',
              '''        release {
            signingConfig signingConfigs.release''',
              1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Android configuration completed.")

          PY


      # ========================================
      # Remove unnecessary permissions
      # ========================================

      - name: Clean permissions
        run: |

          python3 - <<'PY'

          import re

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permissions = [
              "READ_CONTACTS",
              "WRITE_CONTACTS",
              "READ_SMS",
              "SEND_SMS",
              "RECEIVE_SMS",
              "CALL_PHONE",
              "READ_PHONE_STATE",
              "ACCESS_FINE_LOCATION",
              "ACCESS_COARSE_LOCATION",
              "CAMERA",
              "RECORD_AUDIO",
              "READ_EXTERNAL_STORAGE",
              "WRITE_EXTERNAL_STORAGE",
              "MANAGE_EXTERNAL_STORAGE",
              "REQUEST_INSTALL_PACKAGES",
              "SYSTEM_ALERT_WINDOW",
              "BIND_ACCESSIBILITY_SERVICE"
          ]

          for permission in permissions:

              pattern = (
                  r'\s*<uses-permission\s+'
                  r'android:name="android\.permission\.'
                  + permission +
                  r'"\s*/>'
              )

              text = re.sub(
                  pattern,
                  '',
                  text
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Unnecessary permissions removed.")

          PY


      # ========================================
      # Pillow
      # ========================================

      - name: Install Pillow
        run: |
          python3 -m pip install pillow


      # ========================================
      # Generate Fox Eggs icon
      # ========================================

      - name: Generate icon
        run: |

          cat > generate_icon.py <<'PY'

          from PIL import Image, ImageDraw

          S = 1024

          img = Image.new(
              "RGBA",
              (S, S),
              (255, 190, 70, 255)
          )

          d = ImageDraw.Draw(img)

          # Background

          d.rounded_rectangle(
              (35, 35, 989, 989),
              radius=190,
              fill=(255, 184, 70, 255)
          )

          # Fox

          d.polygon(
              [
                  (150,350),
                  (190,135),
                  (365,245),
                  (512,205),
                  (659,245),
                  (834,135),
                  (874,350),
                  (825,610),
                  (700,770),
                  (512,830),
                  (324,770),
                  (199,610)
              ],
              fill=(215,91,42,255)
          )

          # Ears

          d.polygon(
              [
                  (205,300),
                  (215,185),
                  (345,275)
              ],
              fill=(255,143,115,255)
          )

          d.polygon(
              [
                  (679,275),
                  (809,185),
                  (819,300)
              ],
              fill=(255,143,115,255)
          )

          # Face

          d.polygon(
              [
                  (512,400),
                  (430,455),
                  (390,590),
                  (425,700),
                  (512,755),
                  (599,700),
                  (634,590),
                  (594,455)
              ],
              fill=(255,239,211,255)
          )

          # Eyes

          d.ellipse(
              (330,430,410,520),
              fill=(35,25,20,255)
          )

          d.ellipse(
              (614,430,694,520),
              fill=(35,25,20,255)
          )

          d.ellipse(
              (352,447,375,472),
              fill=(255,255,255,255)
          )

          d.ellipse(
              (636,447,659,472),
              fill=(255,255,255,255)
          )

          # Nose

          d.ellipse(
              (468,555,556,625),
              fill=(40,25,22,255)
          )

          # Egg

          egg = [
              (760,455),
              (735,480),
              (720,530),
              (725,600),
              (745,680),
              (780,755),
              (825,805),
              (870,775),
              (900,710),
              (920,625),
              (918,550),
              (900,490),
              (870,455),
              (815,435)
          ]

          d.polygon(
              egg,
              fill=(255,250,232,255)
          )

          d.ellipse(
              (760,535,805,580),
              fill=(235,115,55,255)
          )

          d.ellipse(
              (830,620,875,665),
              fill=(235,115,55,255)
          )

          d.ellipse(
              (785,700,825,740),
              fill=(235,115,55,255)
          )

          img.save(
              "fox-eggs-icon.png",
              "PNG"
          )

          print("Icon created.")

          PY

          python3 generate_icon.py


      # ========================================
      # Android icon sizes
      # ========================================

      - name: Generate Android icons
        run: |

          python3 - <<'PY'

          from PIL import Image
          import os

          source = Image.open(
              "fox-eggs-icon.png"
          ).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          base = "android/app/src/main/res"

          for density, size in sizes.items():

              folder = os.path.join(
                  base,
                  "mipmap-" + density
              )

              os.makedirs(
                  folder,
                  exist_ok=True
              )

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  os.path.join(
                      folder,
                      "ic_launcher.png"
                  ),
                  "PNG"
              )

              icon.save(
                  os.path.join(
                      folder,
                      "ic_launcher_round.png"
                  ),
                  "PNG"
              )

          print("Icons generated.")

          PY


      # ========================================
      # Remove default adaptive icon
      # ========================================

      - name: Remove default icons
        run: |

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml


      # ========================================
      # Version
      # ========================================

      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |

          VERSION_CODE=$((RUN_NUMBER + 100))

          VERSION_NAME="1.0.${RUN_NUMBER}"

          python3 - <<PY

          import re

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode ${VERSION_CODE}',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "${VERSION_NAME}"',
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          PY

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"


      # ========================================
      # Load SAME KEYSTORE
      # ========================================

      - name: Decode existing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |

          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore

          test -s FoxEggs.keystore

          echo "Existing keystore loaded."


      - name: Copy Keystore
        run: |

          cp \
            FoxEggs.keystore \
            android/app/FoxEggs.keystore


      # ========================================
      # Signing properties
      # ========================================

      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |

          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}

          EOF


      # ========================================
      # Verify configuration
      # ========================================

      - name: Verify configuration
        run: |

          echo "===================================="
          echo "APPLICATION"
          echo "===================================="

          grep "applicationId" android/app/build.gradle

          echo ""
          echo "VERSION"

          grep "versionCode" android/app/build.gradle
          grep "versionName" android/app/build.gradle

          echo ""
          echo "COMPILE SDK"

          grep "compileSdk" android/app/build.gradle

          echo ""
          echo "PACKAGE:"
          echo "com.foxeggs.game"


      # ========================================
      # Build APK
      # ========================================

      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --no-daemon


      # ========================================
      # Inspect APK
      # ========================================

      - name: Inspect APK
        run: |

          APK="android/app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          echo "======================================"
          echo "FOX EGGS APK CHECK"
          echo "======================================"

          echo ""
          echo "FILE:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "PACKAGE / VERSION / SDK:"
          "$AAPT" dump badging "$APK" | head -n 15

          echo ""
          echo "REQUESTED PERMISSIONS:"
          "$AAPT" dump permissions "$APK"

          echo ""
          echo "SIGNATURE:"
          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "======================================"
          echo "CHECK FINISHED"
          echo "======================================"


      # ========================================
      # Build AAB
      # ========================================

      - name: Build AAB
        working-directory: android
        run: |

          ./gradlew bundleRelease --no-daemon


      # ========================================
      # Prepare files
      # ========================================

      - name: Prepare release
        run: |

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/FoxEggs.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/FoxEggs.aab

          cp \
            fox-eggs-icon.png \
            release/FoxEggs-Icon.png


      # ========================================
      # Upload
      # ========================================

      - name: Upload Fox Eggs Release
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-Release
          path: release/
          if-no-files-found: error


      # ========================================
      # Cleanup
      # ========================================

      - name: Cleanup
        if: always()
        run: |

          rm -f FoxEggs.keystore

          rm -f android/app/FoxEggs.keystore
