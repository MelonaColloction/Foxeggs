name: Build Fox Eggs Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================
      # NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ==========================================
      # INSTALL REQUIRED ANDROID PACKAGES
      # ==========================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "Android SDK packages installed successfully."

      # ==========================================
      # PREPARE GAME (کپی همه فایل‌های بازی)
      # ==========================================
      - name: Prepare game
        run: |
          test -f index.html
          rm -rf www
          mkdir -p www

          rsync -av \
            --exclude='www' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='release' \
            --exclude='*.keystore' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json' \
            ./ www/

          echo "Game prepared successfully."
          find www -type f | head -n 50

      # ==========================================
      # OBFUSCATE & MINIFY (SAFE FOR GAME & ONLINE)
      # ==========================================
      - name: Obfuscate and Minify Game
        run: |
          echo "🔒 Installing obfuscator..."
          npm install -g javascript-obfuscator
          npm install -g html-minifier-terser

          # ۱. فشرده‌سازی HTML
          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js false \
            www/index.html -o www/index.html.min
          mv www/index.html.min www/index.html

          # ۲. مبهم‌سازی امن بازی
          python3 - <<'PY'
          import re, os, subprocess, tempfile, shutil, glob

          # =========================================================
          # کلمات کلیدی که برای اجرای بازی و بخش آنلاین حیاتی هستند
          # و نباید هرگز مبهم شوند
          # =========================================================
          PROTECTED_LITERALS = [
              # --- کانواس و گرافیک بازی ---
              "canvas", "Canvas", "context", "ctx", "getContext", "2d", "webgl",
              "requestAnimationFrame", "cancelAnimationFrame", "setInterval", "clearInterval",
              "setTimeout", "clearTimeout", "performance", "now", "Date",
              "fillRect", "clearRect", "drawImage", "beginPath", "closePath",
              "fill", "stroke", "arc", "moveTo", "lineTo", "save", "restore",
              "translate", "rotate", "scale", "width", "height", "style", "display",
              # --- بخش آنلاین / Multiplayer (PeerJS / WebSocket) ---
              "peer", "Peer", "PeerJS", "peerjs", "io", "socket", "Socket",
              "WebSocket", "onopen", "onmessage", "onerror", "onclose",
              "connect", "disconnect", "send", "emit", "on", "off", "once",
              "broadcast", "room", "join", "leave", "host", "client", "guest",
              "player", "players", "opponent", "id", "peerId", "connection",
              "open", "data", "close", "error", "call", "answer",
              "serialization", "binaryType", "arraybuffer", "blob",
              # --- ذخیره‌سازی و داده کاربر ---
              "localStorage", "sessionStorage", "indexedDB",
              "getItem", "setItem", "removeItem", "clear",
              # --- فیزیک و منطق بازی ---
              "score", "level", "time", "timer", "life", "lives", "hp",
              "x", "y", "vx", "vy", "dx", "dy", "speed", "gravity",
              "physics", "update", "render", "loop", "tick", "frame",
              "game", "Game", "state", "scene", "start", "stop", "pause", "resume",
              # --- ورودی‌های کاربر ---
              "click", "touch", "touchstart", "touchmove", "touchend",
              "mousedown", "mouseup", "mousemove", "keydown", "keyup",
              "addEventListener", "removeEventListener", "dispatchEvent",
              # --- Capacitor / اندروید ---
              "Capacitor", "Plugins", "Android", "webkit", "JavascriptInterface",
              # --- رشته‌های عمومی که نباید در string-array بروند ---
              "FoxEggs", "Fox Eggs", "foxeggs", "com.foxeggs.game"
          ]

          RESERVED_IDENTIFIERS = [
              "window", "document", "navigator", "location", "history",
              "console", "Math", "JSON", "Date", "Promise", "Object",
              "Array", "String", "Number", "Boolean", "Function",
              "Symbol", "Map", "Set", "WeakMap", "WeakSet",
              "Error", "TypeError", "SyntaxError", "RegExp",
              "undefined", "null", "true", "false", "this",
              "localStorage", "sessionStorage", "indexedDB",
              "fetch", "XMLHttpRequest", "WebSocket", "Worker",
              "requestAnimationFrame", "setTimeout", "setInterval",
              "clearTimeout", "clearInterval",
              "alert", "confirm", "prompt",
              "parseInt", "parseFloat", "isNaN", "isFinite",
              "encodeURIComponent", "decodeURIComponent",
              "atob", "btoa", "crypto", "subtle"
          ]

          def build_obf_options(extra_strings=None):
              # ⚠️ تنظیمات سبک و مخصوص بازی: منطق و گرافیک سالم می‌مانند
              opts = [
                  "--compact", "true",
                  "--identifier-names-generator", "hexadecimal",
                  "--rename-globals", "false",
                  "--rename-properties", "false",   # حیاتی برای بازی و peerjs
                  "--string-array", "true",
                  "--string-array-encoding", "base64",
                  "--string-array-threshold", "0.75",
                  "--string-array-rotate", "true",
                  "--string-array-shuffle", "true",
                  "--string-array-wrappers-count", "1",
                  "--disable-console-output", "false"
                  # ❌ control-flow-flattening و dead-code-injection حذف شدند
                  # تا بازی فریز نشود و اتصال آنلاین (peerjs) قطع نشود
              ]

              for s in RESERVED_IDENTIFIERS + PROTECTED_LITERALS:
                  if re.fullmatch(r'[A-Za-z_$][A-Za-z0-9_$]*', s):
                      opts += ["--reserved-names", s]

              protected_strings = [s for s in PROTECTED_LITERALS if len(s) >= 2]
              if extra_strings:
                  for s in extra_strings:
                      if s and 2 <= len(s) <= 100 and s not in protected_strings:
                          protected_strings.append(s)
              opts += ["--reserved-strings", ",".join(protected_strings)]
              return opts

          def obfuscate(js_code, tag, extra_strings=None):
              tmpdir = tempfile.mkdtemp()
              src = os.path.join(tmpdir, "in.js")
              dst = os.path.join(tmpdir, "out.js")
              try:
                  with open(src, "w", encoding="utf-8") as f: f.write(js_code)
                  res = subprocess.run(["javascript-obfuscator", src, "--output", dst, *build_obf_options(extra_strings)], capture_output=True, text=True)
                  if res.returncode != 0:
                      print(f"⚠️ Obfuscation FAILED for {tag}:\n{res.stderr[:1000]}")
                      return None
                  if not os.path.exists(dst): return None
                  with open(dst, "r", encoding="utf-8") as f: return f.read()
              finally:
                  shutil.rmtree(tmpdir, ignore_errors=True)

          # ------------------------------------------------------------
          # مبهم‌سازی فایل‌های JS جداگانه
          # ------------------------------------------------------------
          js_files = sorted(glob.glob("www/**/*.js", recursive=True))
          for js_path in js_files:
              with open(js_path, "r", encoding="utf-8") as f:
                  js = f.read()
              if not js.strip(): continue
              obs = obfuscate(js, js_path)
              if obs is None:
                  print(f"⚠️  Skipping (failed): {js_path}")
                  continue
              with open(js_path, "w", encoding="utf-8") as f:
                  f.write(obs)
              print(f"✅ obfuscated: {js_path}")

          # ------------------------------------------------------------
          # مبهم‌سازی اسکریپت‌های داخل HTML
          # ------------------------------------------------------------
          with open("www/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          script_re = re.compile(r'<script(\s[^>]*)?>(.*?)</script>', re.DOTALL)
          stats = {"total": 0, "obfuscated": 0, "skipped": 0, "failed": 0}

          def repl(m):
              attrs = m.group(1) or ""
              body = m.group(2)
              stats["total"] += 1
              if 'src=' in attrs or not body.strip() or re.search(r'type\s*=\s*[\'"](?:application/ld\+json|importmap|application/json)[\'"]', attrs):
                  stats["skipped"] += 1
                  return m.group(0)
              obs = obfuscate(body, f"<script#{stats['total']}>")
              if obs is None:
                  stats["failed"] += 1
                  return m.group(0)
              stats["obfuscated"] += 1
              return f'<script{attrs}>{obs}</script>'

          html = script_re.sub(repl, html)
          with open("www/index.html", "w", encoding="utf-8") as f: f.write(html)
          print(f"📊 HTML scripts: total={stats['total']} obf={stats['obfuscated']} skip={stats['skipped']} fail={stats['failed']}")
          PY
          echo "✅ Game obfuscated safely (multiplayer preserved)."

      # ==========================================
      # CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: npm install

      # ==========================================
      # CREATE CAPACITOR CONFIG
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www"
          }
          EOF

      # ==========================================
      # ADD ANDROID
      # ==========================================
      - name: Add Android
        run: npx cap add android

      # ==========================================
      # ENABLE IMMERSIVE FULLSCREEN
      # ==========================================
      - name: Enable Fullscreen
        run: |
          python3 - <<'PY'
          import os
          import re

          base = "android/app/src/main/java"
          main_activity = None

          for root, dirs, files in os.walk(base):
              if "MainActivity.java" in files:
                  main_activity = os.path.join(root, "MainActivity.java")
                  break

          if not main_activity:
              raise SystemExit("MainActivity.java not found.")

          print("Found MainActivity:", main_activity)

          with open(main_activity, "r", encoding="utf-8") as f:
              original = f.read()

          package_match = re.search(
              r'^\s*package\s+([^;]+);',
              original,
              re.MULTILINE
          )

          if not package_match:
              raise SystemExit("Package name not found in MainActivity.java")

          package_name = package_match.group(1)
          print("Package:", package_name)

          fullscreen_activity = f'''package {package_name};

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }}
          }}
          '''

          with open(main_activity, "w", encoding="utf-8") as f:
              f.write(fullscreen_activity)

          print("Fullscreen MainActivity created successfully.")
          PY

      # ==========================================
      # SYNC ANDROID
      # ==========================================
      - name: Sync Android
        run: npx cap sync android

      # ==========================================
      # VERSION
      # ==========================================
      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "=========================================="
          echo "VERSION"
          echo "=========================================="
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

      # ==========================================
      # LOAD EXISTING KEYSTORE
      # ==========================================
      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore
          test -s FoxEggs.keystore
          mkdir -p android/app
          cp FoxEggs.keystore android/app/FoxEggs.keystore
          echo "Keystore loaded successfully."

      # ==========================================
      # CONFIGURE SIGNING PROPERTIES
      # ==========================================
      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          EOF
          echo "Signing properties configured."

      # ==========================================
      # CONFIGURE ANDROID GRADLE (بدون Minify)
      # ==========================================
      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          import re
          import os

          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.foxeggs.game"', text, count=1)
          text = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', text, count=1)
          text = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["VERSION_CODE"], text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ["VERSION_NAME"] + '"', text, count=1)

          text = re.sub(r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)', '', text, count=1, flags=re.S)

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

          '''

          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1, flags=re.S)

          if re.search(r'buildTypes\s*\{.*?release\s*\{', text, re.S):
              release_match = re.search(r'(buildTypes\s*\{\s*release\s*\{)(.*?)(\n\s*\})', text, re.S)
              if release_match:
                  release_body = release_match.group(2)

                  if "minifyEnabled" in release_body:
                      release_body = re.sub(r'minifyEnabled\s+\w+', 'minifyEnabled false', release_body, count=1)
                  else:
                      release_body = "\n            minifyEnabled false" + release_body

                  text = text[:release_match.start(2)] + release_body + text[release_match.end(2):]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Android Gradle configured (minify disabled).")
          PY

      # ==========================================
      # CLEAN UNNECESSARY PERMISSIONS
      # ==========================================
      - name: Clean unnecessary permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permissions = [
              "READ_CONTACTS", "WRITE_CONTACTS", "READ_SMS", "SEND_SMS",
              "RECEIVE_SMS", "CALL_PHONE", "READ_PHONE_STATE",
              "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION",
              "RECORD_AUDIO",
              "READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE",
              "MANAGE_EXTERNAL_STORAGE", "REQUEST_INSTALL_PACKAGES",
              "SYSTEM_ALERT_WINDOW", "BIND_ACCESSIBILITY_SERVICE"
          ]

          for permission in permissions:
              pattern = r'\s*<uses-permission\s+android:name="android\.permission\.' + permission + r'"\s*/>'
              text = re.sub(pattern, '', text)

          text = re.sub(r'android:debuggable="true"', 'android:debuggable="false"', text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print("Unnecessary permissions removed.")
          PY

      # ==========================================
      # ADD PERMISSIONS (INTERNET برای بازی آنلاین)
      # ==========================================
      - name: Add permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          extras = ""
          for perm in [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.VIBRATE"
          ]:
              if perm not in text:
                  extras += f'    <uses-permission android:name="{perm}" />\n'

          if extras:
              text = text.replace('<application', extras + '    <application', 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Permissions added.")
          PY

      # ==========================================
      # INSTALL PILLOW
      # ==========================================
      - name: Install Pillow
        run: python3 -m pip install pillow

      # ==========================================
      # FIND CUSTOM GAME ICON
      # ==========================================
      - name: Find custom game icon
        run: |
          python3 - <<'PY'
          import os
          extensions = (".png", ".jpg", ".jpeg", ".webp")
          files = [f for f in os.listdir(".") if os.path.isfile(f) and f.lower().endswith(extensions)]
          ignored = {"fox-eggs-icon.png", "game-logo.png"}
          files = [f for f in files if f.lower() not in ignored]

          if not files:
              raise SystemExit("No image file found in project root.")

          logo = files[0]
          print("==========================================")
          print("CUSTOM GAME ICON")
          print("==========================================")
          print("Using image:", logo)
          with open("CUSTOM_ICON", "w") as f:
              f.write(logo)
          PY

      # ==========================================
      # GENERATE ANDROID ICONS
      # ==========================================
      - name: Generate Android icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os
          with open("CUSTOM_ICON", "r") as f:
              filename = f.read().strip()

          print("Loading custom icon:", filename)
          source = Image.open(filename).convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}

          for density, size in sizes.items():
              folder = "android/app/src/main/res/mipmap-" + density
              os.makedirs(folder, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder + "/ic_launcher.png")
              icon.save(folder + "/ic_launcher_round.png")

          print("Android icons generated successfully.")
          PY

      # ==========================================
      # REMOVE ADAPTIVE ICON DEFAULTS
      # ==========================================
      - name: Remove adaptive icon defaults
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      # ==========================================
      # VERIFY CONFIGURATION
      # ==========================================
      - name: Verify configuration
        run: |
          echo "=========================================="
          echo "FOX EGGS CONFIGURATION"
          echo "=========================================="
          echo ""
          echo "APPLICATION ID:"
          grep "applicationId" android/app/build.gradle
          echo ""
          echo "VERSION:"
          grep "versionCode" android/app/build.gradle
          grep "versionName" android/app/build.gradle
          echo ""
          echo "COMPILE SDK:"
          grep "compileSdk" android/app/build.gradle
          echo ""
          echo "MINIFY:"
          grep "minifyEnabled" android/app/build.gradle

      # ==========================================
      # BUILD RELEASE APK
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon

      # ==========================================
      # INSPECT APK
      # ==========================================
      - name: Inspect APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          echo "=========================================="
          echo "FOX EGGS APK"
          echo "=========================================="
          echo ""
          echo "APK FILE:"
          ls -lh "$APK"
          echo ""
          echo "SHA256:"
          sha256sum "$APK"
          echo ""
          echo "PACKAGE / VERSION:"
          "$AAPT" dump badging "$APK" | head -n 20
          echo ""
          echo "PERMISSIONS:"
          "$AAPT" dump permissions "$APK"
          echo ""
          echo "SIGNATURE:"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      # ==========================================
      # BUILD RELEASE AAB
      # ==========================================
      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # ==========================================
      # PREPARE RELEASE
      # ==========================================
      - name: Prepare release
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/release/app-release.apk release/FoxEggs.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/FoxEggs.aab

          CUSTOM_ICON=$(cat CUSTOM_ICON)
          cp "$CUSTOM_ICON" release/FoxEggs-Icon.png

          echo "Release files prepared."

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================
      - name: Upload Fox Eggs Release
        uses: actions/upload-artifact@v6
        with:
          name: FoxEggs-Release
          path: release/
          if-no-files-found: error

      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -f FoxEggs.keystore
          rm -f android/app/FoxEggs.keystore
