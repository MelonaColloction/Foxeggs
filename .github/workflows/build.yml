name: Build Fox Eggs Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================
      # NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24


      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # ==========================================
      # INSTALL REQUIRED ANDROID PACKAGES
      # ==========================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed successfully."


      # ==========================================
      # PREPARE GAME
      # ==========================================
      - name: Prepare game
        run: |
          test -f index.html

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          echo "Game prepared successfully."


      # ==========================================
      # OBFUSCATE + ANTI-DEBUG
      # ==========================================
      - name: Obfuscate and inject anti-debug
        run: |
          npm install -g javascript-obfuscator

          python3 - <<'PY'
          import re
          import subprocess
          import os

          HTML_FILE = "www/index.html"

          # ==========================================
          # ANTI-DEBUG CODE (injected before obfuscation)
          # ==========================================
          ANTI_DEBUG = r"""
          (function() {
              'use strict';

              var _0xad = {};

              // ---------- 1. Detect DevTools ----------
              _0xad.devtools = function() {
                  var threshold = 160;
                  var start = performance.now();
                  debugger;
                  var end = performance.now();
                  if (end - start > threshold) return true;

                  var w = window.outerWidth - window.innerWidth;
                  var h = window.outerHeight - window.innerHeight;
                  if (w > threshold || h > threshold) return true;

                  var el = new Image();
                  Object.defineProperty(el, 'id', {
                      get: function() {
                          _0xad.triggered = true;
                          return 'x';
                      }
                  });
                  try { console.log(el); } catch(e) {}
                  if (_0xad.triggered) return true;

                  return false;
              };

              // ---------- 2. Detect Console ----------
              _0xad.console = function() {
                  var check = /./;
                  check.toString = function() {
                      _0xad.triggered = true;
                      return '';
                  };
                  try {
                      console.log('%c', check);
                  } catch(e) {}
                  return _0xad.triggered === true;
              };

              // ---------- 3. Detect Frida ----------
              _0xad.frida = function() {
                  var keys = [
                      'frida', 'Frida', '__frida', '_frida',
                      'FRIDA', 'fridaHook', 'frida-helper'
                  ];
                  for (var i = 0; i < keys.length; i++) {
                      if (keys[i] in window) return true;
                  }
                  if (typeof window.Frida !== 'undefined') return true;
                  if (typeof window.frida !== 'undefined') return true;
                  return false;
              };

              // ---------- 4. Detect Debugger Timing ----------
              _0xad.timing = function() {
                  var t1 = performance.now();
                  debugger;
                  var t2 = performance.now();
                  return (t2 - t1) > 100;
              };

              // ---------- 5. Detect Function.toString tamper ----------
              _0xad.tamper = function() {
                  try {
                      var fn = function(){};
                      var src = fn.toString();
                      if (src.indexOf('[native code]') === -1 &&
                          src.indexOf('function') === -1) {
                          return true;
                      }
                  } catch(e) {}
                  return false;
              };

              // ---------- 6. Kill switch ----------
              _0xad.react = function() {
                  try {
                      localStorage.clear();
                      sessionStorage.clear();
                  } catch(e) {}

                  var _0xdead = function() {
                      while (true) {
                          debugger;
                          var _ = 0;
                          for (var i = 0; i < 1000; i++) { _ += i; }
                      }
                  };

                  _0xdead();
              };

              // ---------- 7. Main loop ----------
              function _0xcheck() {
                  try {
                      if (_0xad.devtools() ||
                          _0xad.console() ||
                          _0xad.frida() ||
                          _0xad.timing() ||
                          _0xad.tamper()) {
                          _0xad.react();
                      }
                  } catch(e) {
                      _0xad.react();
                  }

                  setTimeout(_0xcheck, 1000);
              }

              setTimeout(_0xcheck, 1000);

              // ---------- 8. Disable console ----------
              var _noop = function(){};
              try {
                  window.console.log = _noop;
                  window.console.warn = _noop;
                  window.console.error = _noop;
                  window.console.debug = _noop;
                  window.console.info = _noop;
                  window.console.table = _noop;
                  window.console.trace = _noop;
                  window.console.dir = _noop;
                  window.console.clear = _noop;
              } catch(e) {}

              // ---------- 9. Block common shortcuts ----------
              document.addEventListener('keydown', function(e) {
                  if (e.key === 'F12') { e.preventDefault(); return false; }
                  if (e.ctrlKey && e.shiftKey) {
                      if (e.key === 'I' || e.key === 'J' || e.key === 'C') {
                          e.preventDefault();
                          return false;
                      }
                  }
                  if (e.ctrlKey && e.key === 'u') {
                      e.preventDefault();
                      return false;
                  }
              }, true);

              // ---------- 10. Block right click ----------
              document.addEventListener('contextmenu', function(e) {
                  e.preventDefault();
                  return false;
              }, true);

              // ---------- 11. Detect console open via toString ----------
              setInterval(function() {
                  try {
                      var _0xe = new Error();
                      Object.defineProperty(_0xe, 'message', {
                          get: function() {
                              _0xad.triggered = true;
                              return '';
                          }
                      });
                      console.log(_0xe);
                      if (_0xad.triggered) {
                          _0xad.react();
                      }
                  } catch(e) {}
              }, 2000);

          })();
          """

          with open(HTML_FILE, "r", encoding="utf-8") as f:
              html = f.read()

          # ==========================================
          # INJECT ANTI-DEBUG INTO <head>
          # ==========================================
          if '<head>' in html:
              html = html.replace(
                  '<head>',
                  '<head>\n<script>\n' + ANTI_DEBUG + '\n</script>\n',
                  1
              )
          elif '<html' in html:
              html = re.sub(
                  r'(<html[^>]*>)',
                  r'\1\n<head>\n<script>\n' + ANTI_DEBUG + '\n</script>\n</head>\n',
                  html,
                  count=1
              )
          else:
              html = '<script>\n' + ANTI_DEBUG + '\n</script>\n' + html

          print("Anti-debug code injected.")

          # ==========================================
          # FIND ALL INLINE SCRIPTS
          # ==========================================
          pattern = r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>'
          scripts = list(re.finditer(pattern, html, re.S | re.I))

          print("=" * 50)
          print(f"FOUND {len(scripts)} INLINE SCRIPT(S) TO OBFUSCATE")
          print("=" * 50)

          # ==========================================
          # OBFUSCATE EACH SCRIPT
          # ==========================================
          for i, match in reversed(list(enumerate(scripts))):

              original_js = match.group(1).strip()
              if not original_js:
                  continue

              tmp_in = f"_tmp_{i}.js"
              tmp_out = f"_tmp_{i}_obf.js"

              with open(tmp_in, "w", encoding="utf-8") as f:
                  f.write(original_js)

              print(f"\nObfuscating script #{i} ({len(original_js)} bytes)...")

              result = subprocess.run([
                  "javascript-obfuscator",
                  tmp_in,
                  "--output", tmp_out,
                  "--compact", "true",
                  "--simplify", "true",
                  "--control-flow-flattening", "true",
                  "--control-flow-flattening-threshold", "1",
                  "--dead-code-injection", "true",
                  "--dead-code-injection-threshold", "0.5",
                  "--string-array", "true",
                  "--string-array-encoding", "rc4",
                  "--string-array-threshold", "1",
                  "--string-array-rotate", "true",
                  "--string-array-shuffle", "true",
                  "--string-array-wrappers-count", "2",
                  "--string-array-wrappers-chained-calls", "true",
                  "--split-strings", "true",
                  "--split-strings-chunk-length", "5",
                  "--identifier-names-generator", "hexadecimal",
                  "--identifiers-prefix", "_0x",
                  "--self-defending", "true",
                  "--debug-protection", "true",
                  "--debug-protection-interval", "1000",
                  "--disable-console-output", "true",
                  "--numbers-to-expressions", "true",
                  "--seed", "0"
              ], capture_output=True, text=True)

              if result.returncode != 0:
                  print("STDERR:", result.stderr)
                  raise SystemExit(f"Obfuscation failed for script #{i}")

              with open(tmp_out, "r", encoding="utf-8") as f:
                  obfuscated = f.read()

              print(f"  -> obfuscated: {len(obfuscated)} bytes")

              html = (
                  html[:match.start(1)]
                  + "\n" + obfuscated + "\n"
                  + html[match.end(1):]
              )

              os.remove(tmp_in)
              os.remove(tmp_out)

          # ==========================================
          # FINAL CLEANUP
          # ==========================================
          html = re.sub(r'<!--(?!\[if).*?-->', '', html, flags=re.S)
          html = re.sub(r'\n\s*\n', '\n', html)
          html = html.replace('\t', ' ')

          with open(HTML_FILE, "w", encoding="utf-8") as f:
              f.write(html)

          print("\n" + "=" * 50)
          print("OBFUSCATION + ANTI-DEBUG COMPLETE")
          print("=" * 50)
          print(f"Final size: {len(html)} bytes")
          PY

          echo ""
          echo "Final index.html:"
          ls -lh www/index.html


      # ==========================================
      # CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          npm install


      # ==========================================
      # CREATE CAPACITOR CONFIG
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www"
          }
          EOF


      # ==========================================
      # ADD ANDROID
      # ==========================================
      - name: Add Android
        run: |
          npx cap add android


      # ==========================================
      # ENABLE IMMERSIVE FULLSCREEN
      # ==========================================
      - name: Enable Fullscreen
        run: |
          python3 - <<'PY'
          import os
          import re

          base = "android/app/src/main/java"

          main_activity = None

          for root, dirs, files in os.walk(base):
              if "MainActivity.java" in files:
                  main_activity = os.path.join(root, "MainActivity.java")
                  break

          if not main_activity:
              raise SystemExit("MainActivity.java not found.")

          print("Found MainActivity:", main_activity)

          with open(main_activity, "r", encoding="utf-8") as f:
              original = f.read()

          package_match = re.search(
              r'^\s*package\s+([^;]+);',
              original,
              re.MULTILINE
          )

          if not package_match:
              raise SystemExit(
                  "Package name not found in MainActivity.java"
              )

          package_name = package_match.group(1)

          print("Package:", package_name)

          fullscreen_activity = f'''package {package_name};

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }}
          }}
          '''

          with open(main_activity, "w", encoding="utf-8") as f:
              f.write(fullscreen_activity)

          print("Fullscreen MainActivity created successfully.")
          PY


      # ==========================================
      # SYNC ANDROID
      # ==========================================
      - name: Sync Android
        run: |
          npx cap sync android


      # ==========================================
      # VERSION
      # ==========================================
      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "VERSION"
          echo "=========================================="
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"


      # ==========================================
      # LOAD EXISTING KEYSTORE
      # ==========================================
      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore

          test -s FoxEggs.keystore

          mkdir -p android/app

          cp FoxEggs.keystore android/app/FoxEggs.keystore

          echo "Keystore loaded successfully."


      # ==========================================
      # CONFIGURE SIGNING PROPERTIES
      # ==========================================
      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"

          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          EOF

          echo "Signing properties configured."


      # ==========================================
      # CONFIGURE ANDROID GRADLE
      # ==========================================
      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          import re
          import os

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'applicationId\s+"[^"]+"',
              'applicationId "com.foxeggs.game"',
              text,
              count=1
          )

          text = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 35',
              text,
              count=1
          )

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode ' + os.environ["VERSION_CODE"],
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "' + os.environ["VERSION_NAME"] + '"',
              text,
              count=1
          )

          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)',
              '',
              text,
              count=1,
              flags=re.S
          )

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

          '''

          if "signingConfigs {" not in text:
              text = text.replace(
                  "    buildTypes {",
                  signing_block + "    buildTypes {",
                  1
              )

          release_pattern = (
              r'(buildTypes\s*\{\s*'
              r'release\s*\{)'
          )

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(
                  release_pattern,
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1,
                  flags=re.S
              )

          if re.search(r'buildTypes\s*\{.*?release\s*\{', text, re.S):

              release_match = re.search(
                  r'(buildTypes\s*\{\s*release\s*\{)(.*?)(\n\s*\})',
                  text,
                  re.S
              )

              if release_match:

                  release_body = release_match.group(2)

                  if "minifyEnabled" in release_body:
                      release_body = re.sub(
                          r'minifyEnabled\s+\w+',
                          'minifyEnabled false',
                          release_body,
                          count=1
                      )
                  else:
                      release_body = (
                          "\n            minifyEnabled false"
                          + release_body
                      )

                  text = (
                      text[:release_match.start(2)]
                      + release_body
                      + text[release_match.end(2):]
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Android Gradle configured successfully.")
          PY


      # ==========================================
      # SHOW GRADLE CONFIG
      # ==========================================
      - name: Show Gradle configuration
        run: |
          echo "=========================================="
          echo "FINAL ANDROID BUILD.GRADLE"
          echo "=========================================="

          cat android/app/build.gradle


      # ==========================================
      # CLEAN UNNECESSARY PERMISSIONS
      # ==========================================
      - name: Clean unnecessary permissions
        run: |
          python3 - <<'PY'
          import re

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permissions = [
              "READ_CONTACTS",
              "WRITE_CONTACTS",
              "READ_SMS",
              "SEND_SMS",
              "RECEIVE_SMS",
              "CALL_PHONE",
              "READ_PHONE_STATE",
              "ACCESS_FINE_LOCATION",
              "ACCESS_COARSE_LOCATION",
              "CAMERA",
              "RECORD_AUDIO",
              "READ_EXTERNAL_STORAGE",
              "WRITE_EXTERNAL_STORAGE",
              "MANAGE_EXTERNAL_STORAGE",
              "REQUEST_INSTALL_PACKAGES",
              "SYSTEM_ALERT_WINDOW",
              "BIND_ACCESSIBILITY_SERVICE"
          ]

          for permission in permissions:

              pattern = (
                  r'\s*<uses-permission\s+'
                  r'android:name="android\.permission\.'
                  + permission +
                  r'"\s*/>'
              )

              text = re.sub(pattern, '', text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Unnecessary permissions removed.")
          PY


      # ==========================================
      # INSTALL PILLOW
      # ==========================================
      - name: Install Pillow
        run: |
          python3 -m pip install pillow


      # ==========================================
      # FIND CUSTOM GAME ICON
      # ==========================================
      - name: Find custom game icon
        run: |
          python3 - <<'PY'
          import os

          extensions = (
              ".png",
              ".jpg",
              ".jpeg",
              ".webp"
          )

          files = [
              f for f in os.listdir(".")
              if os.path.isfile(f)
              and f.lower().endswith(extensions)
          ]

          ignored = {
              "fox-eggs-icon.png",
              "game-logo.png"
          }

          files = [
              f for f in files
              if f.lower() not in ignored
          ]

          if not files:
              raise SystemExit(
                  "No image file found in project root."
              )

          logo = files[0]

          print("==========================================")
          print("CUSTOM GAME ICON")
          print("==========================================")
          print("Using image:", logo)

          with open("CUSTOM_ICON", "w") as f:
              f.write(logo)
          PY


      # ==========================================
      # GENERATE ANDROID ICONS
      # ==========================================
      - name: Generate Android icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os

          with open("CUSTOM_ICON", "r") as f:
              filename = f.read().strip()

          print("Loading custom icon:", filename)

          source = Image.open(filename).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():

              folder = (
                  "android/app/src/main/res/mipmap-"
                  + density
              )

              os.makedirs(folder, exist_ok=True)

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  folder + "/ic_launcher.png"
              )

              icon.save(
                  folder + "/ic_launcher_round.png"
              )

          print("Android icons generated successfully.")
          PY


      # ==========================================
      # REMOVE ADAPTIVE ICON DEFAULTS
      # ==========================================
      - name: Remove adaptive icon defaults
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml


      # ==========================================
      # VERIFY CONFIGURATION
      # ==========================================
      - name: Verify configuration
        run: |
          echo "=========================================="
          echo "FOX EGGS CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "APPLICATION ID:"
          grep "applicationId" android/app/build.gradle

          echo ""
          echo "VERSION:"
          grep "versionCode" android/app/build.gradle
          grep "versionName" android/app/build.gradle

          echo ""
          echo "COMPILE SDK:"
          grep "compileSdk" android/app/build.gradle

          echo ""
          echo "SIGNING:"
          grep -A10 "signingConfigs" android/app/build.gradle


      # ==========================================
      # BUILD RELEASE APK
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --no-daemon


      # ==========================================
      # INSPECT APK
      # ==========================================
      - name: Inspect APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          echo "=========================================="
          echo "FOX EGGS APK"
          echo "=========================================="

          echo ""
          echo "APK FILE:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "PACKAGE / VERSION:"
          "$AAPT" dump badging "$APK" | head -n 20

          echo ""
          echo "PERMISSIONS:"
          "$AAPT" dump permissions "$APK"

          echo ""
          echo "SIGNATURE:"
          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"


      # ==========================================
      # BUILD RELEASE AAB
      # ==========================================
      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon


      # ==========================================
      # PREPARE RELEASE
      # ==========================================
      - name: Prepare release
        run: |
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/FoxEggs.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/FoxEggs.aab

          CUSTOM_ICON=$(cat CUSTOM_ICON)

          cp \
            "$CUSTOM_ICON" \
            release/FoxEggs-Icon.png

          echo "Release files prepared."


      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================
      - name: Upload Fox Eggs Release
        uses: actions/upload-artifact@v6
        with:
          name: FoxEggs-Release
          path: release/
          if-no-files-found: error


      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -f FoxEggs.keystore
          rm -f android/app/FoxEggs.keystore
