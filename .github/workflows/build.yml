name: Build Fox Eggs Android

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    name: Build Fox Eggs Release

    runs-on: ubuntu-latest

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # Node.js
      # ========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ========================================
      # Java 21
      # ========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ========================================
      # Android SDK
      # ========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ========================================
      # Check game
      # ========================================

      - name: Check index.html
        run: |
          test -f index.html
          echo "Fox Eggs game found."


      # ========================================
      # Prepare Web files
      # ========================================

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html


      # ========================================
      # package.json
      # ========================================

      - name: Create package.json
        run: |

          cat > package.json <<'EOF'

          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }

          EOF


      # ========================================
      # Install npm
      # ========================================

      - name: Install dependencies
        run: |
          npm install


      # ========================================
      # Capacitor
      # ========================================

      - name: Create Capacitor config
        run: |

          cat > capacitor.config.json <<'EOF'

          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www"
          }

          EOF


      # ========================================
      # Add Android
      # ========================================

      - name: Add Android
        run: |
          npx cap add android


      # ========================================
      # Sync Android
      # ========================================

      - name: Sync Android
        run: |
          npx cap sync android


      # ========================================
      # Remove unnecessary permissions
      # ========================================

      - name: Clean Android permissions
        run: |

          python3 - <<'PY'

          import os
          import re

          manifest = "android/app/src/main/AndroidManifest.xml"

          if os.path.exists(manifest):

              with open(manifest, "r", encoding="utf-8") as f:
                  text = f.read()

              dangerous_permissions = [
                  "android.permission.READ_CONTACTS",
                  "android.permission.WRITE_CONTACTS",
                  "android.permission.READ_SMS",
                  "android.permission.SEND_SMS",
                  "android.permission.RECEIVE_SMS",
                  "android.permission.CALL_PHONE",
                  "android.permission.READ_PHONE_STATE",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.CAMERA",
                  "android.permission.RECORD_AUDIO",
                  "android.permission.READ_EXTERNAL_STORAGE",
                  "android.permission.WRITE_EXTERNAL_STORAGE",
                  "android.permission.MANAGE_EXTERNAL_STORAGE",
                  "android.permission.REQUEST_INSTALL_PACKAGES",
                  "android.permission.SYSTEM_ALERT_WINDOW",
                  "android.permission.BIND_ACCESSIBILITY_SERVICE"
              ]

              for permission in dangerous_permissions:

                  text = re.sub(
                      r'<uses-permission\s+android:name="' +
                      re.escape(permission) +
                      r'"\s*/>\s*',
                      '',
                      text
                  )

              with open(manifest, "w", encoding="utf-8") as f:
                  f.write(text)

          print("Unnecessary permissions removed.")

          PY


      # ========================================
      # Install Pillow
      # ========================================

      - name: Install Pillow
        run: |

          python3 -m pip install --upgrade pip

          python3 -m pip install pillow


      # ========================================
      # Generate Fox Eggs Icon
      # ========================================

      - name: Generate Fox Eggs icon
        run: |

          cat > generate_icon.py <<'PY'

          from PIL import Image, ImageDraw

          SIZE = 1024

          img = Image.new(
              "RGBA",
              (SIZE, SIZE),
              (255, 190, 70, 255)
          )

          draw = ImageDraw.Draw(img)

          # Background

          draw.rounded_rectangle(
              (35, 35, 989, 989),
              radius=190,
              fill=(255, 184, 70, 255)
          )

          # Fox head

          draw.polygon(
              [
                  (150, 350),
                  (190, 135),
                  (365, 245),
                  (512, 205),
                  (659, 245),
                  (834, 135),
                  (874, 350),
                  (825, 610),
                  (700, 770),
                  (512, 830),
                  (324, 770),
                  (199, 610)
              ],
              fill=(215, 91, 42, 255)
          )

          # Inner ears

          draw.polygon(
              [
                  (205, 300),
                  (215, 185),
                  (345, 275)
              ],
              fill=(255, 143, 115, 255)
          )

          draw.polygon(
              [
                  (679, 275),
                  (809, 185),
                  (819, 300)
              ],
              fill=(255, 143, 115, 255)
          )

          # Face

          draw.polygon(
              [
                  (512, 400),
                  (430, 455),
                  (390, 590),
                  (425, 700),
                  (512, 755),
                  (599, 700),
                  (634, 590),
                  (594, 455)
              ],
              fill=(255, 239, 211, 255)
          )

          # Eyes

          draw.ellipse(
              (330, 430, 410, 520),
              fill=(35, 25, 20, 255)
          )

          draw.ellipse(
              (614, 430, 694, 520),
              fill=(35, 25, 20, 255)
          )

          # Eye highlights

          draw.ellipse(
              (352, 447, 375, 472),
              fill=(255, 255, 255, 255)
          )

          draw.ellipse(
              (636, 447, 659, 472),
              fill=(255, 255, 255, 255)
          )

          # Nose

          draw.ellipse(
              (468, 555, 556, 625),
              fill=(40, 25, 22, 255)
          )

          # Smile

          draw.arc(
              (420, 575, 604, 720),
              15,
              165,
              fill=(45, 25, 20, 255),
              width=12
          )

          # Egg

          egg = [
              (760, 455),
              (735, 480),
              (720, 530),
              (725, 600),
              (745, 680),
              (780, 755),
              (825, 805),
              (870, 775),
              (900, 710),
              (920, 625),
              (918, 550),
              (900, 490),
              (870, 455),
              (815, 435)
          ]

          draw.polygon(
              egg,
              fill=(255, 250, 232, 255)
          )

          # Egg spots

          draw.ellipse(
              (760, 535, 805, 580),
              fill=(235, 115, 55, 255)
          )

          draw.ellipse(
              (830, 620, 875, 665),
              fill=(235, 115, 55, 255)
          )

          draw.ellipse(
              (785, 700, 825, 740),
              fill=(235, 115, 55, 255)
          )

          # Egg shine

          draw.ellipse(
              (785, 470, 805, 500),
              fill=(255, 255, 255, 220)
          )

          # Save

          img.save(
              "fox-eggs-icon.png",
              "PNG"
          )

          print("Fox Eggs icon generated.")

          PY

          python3 generate_icon.py


      # ========================================
      # Android icon sizes
      # ========================================

      - name: Generate Android icons
        run: |

          python3 - <<'PY'

          from PIL import Image
          import os

          source = Image.open(
              "fox-eggs-icon.png"
          ).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          base = "android/app/src/main/res"

          for density, size in sizes.items():

              folder = os.path.join(
                  base,
                  "mipmap-" + density
              )

              os.makedirs(
                  folder,
                  exist_ok=True
              )

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  os.path.join(
                      folder,
                      "ic_launcher.png"
                  ),
                  "PNG"
              )

              icon.save(
                  os.path.join(
                      folder,
                      "ic_launcher_round.png"
                  ),
                  "PNG"
              )

          print("Android icons generated.")

          PY


      # ========================================
      # Remove default adaptive icons
      # ========================================

      - name: Remove default icons
        run: |

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml


      # ========================================
      # Set version
      # ========================================

      - name: Set Android version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |

          VERSION_CODE=$((RUN_NUMBER + 100))

          VERSION_NAME="1.0.${RUN_NUMBER}"

          python3 - <<PY

          import re

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode ' + str(${VERSION_CODE}),
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "' + "${VERSION_NAME}" + '"',
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Version Code:", ${VERSION_CODE})
          print("Version Name:", "${VERSION_NAME}")

          PY


      # ========================================
      # Decode existing Keystore
      # ========================================

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |

          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore

          test -s FoxEggs.keystore

          echo "Existing release keystore loaded."


      # ========================================
      # Copy Keystore
      # ========================================

      - name: Copy Keystore
        run: |

          cp \
            FoxEggs.keystore \
            android/app/FoxEggs.keystore


      # ========================================
      # Configure signing
      # ========================================

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |

          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}

          EOF


      # ========================================
      # Configure release signing
      # ========================================

      - name: Configure release signing
        run: |

          python3 - <<'PY'

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                  }
              }
          """

          if "signingConfigs {" not in text:

              text = text.replace(
                  "android {",
                  "android {" + signing_config,
                  1
              )

          text = text.replace(
              "release {",
              """release {
                      signingConfig signingConfigs.release""",
              1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Release signing configured.")

          PY


      # ========================================
      # Verify package and version
      # ========================================

      - name: Verify Android configuration
        run: |

          echo "======================================"
          echo "FOX EGGS CONFIGURATION"
          echo "======================================"

          grep -n "applicationId" android/app/build.gradle || true

          grep -n "versionCode" android/app/build.gradle || true

          grep -n "versionName" android/app/build.gradle || true

          echo ""
          echo "Package must remain:"
          echo "com.foxeggs.game"

          echo ""
          echo "Keystore must remain unchanged."


      # ========================================
      # Build APK
      # ========================================

      - name: Build Release APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --no-daemon


      # ========================================
      # Inspect APK
      # ========================================

      - name: Inspect APK
        run: |

          APK="android/app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          echo "======================================"
          echo "FOX EGGS APK CHECK"
          echo "======================================"

          echo ""
          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "PACKAGE / VERSION / SDK:"
          "$AAPT" dump badging "$APK" | head -n 15

          echo ""
          echo "REQUESTED PERMISSIONS:"
          "$AAPT" dump permissions "$APK"

          echo ""
          echo "SIGNATURE:"
          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "======================================"
          echo "APK CHECK FINISHED"
          echo "======================================"


      # ========================================
      # Build AAB
      # ========================================

      - name: Build Release AAB
        working-directory: android
        run: |

          ./gradlew bundleRelease --no-daemon


      # ========================================
      # Prepare release files
      # ========================================

      - name: Prepare release
        run: |

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/FoxEggs.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/FoxEggs.aab

          cp \
            fox-eggs-icon.png \
            release/FoxEggs-Icon.png


      # ========================================
      # Upload files
      # ========================================

      - name: Upload Fox Eggs Release
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-Release
          path: release/
          if-no-files-found: error


      # ========================================
      # Cleanup sensitive files
      # ========================================

      - name: Cleanup
        if: always()
        run: |

          rm -f FoxEggs.keystore

          rm -f android/app/FoxEggs.keystore
