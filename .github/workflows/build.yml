name: Build Fox Eggs Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Fox Eggs Release
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================
      # Prepare game
      # =========================

      - name: Check game
        run: |
          test -f index.html

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      # =========================
      # Capacitor
      # =========================

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

      - name: Install dependencies
        run: |
          npm install

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      # =========================
      # Install Pillow
      # =========================

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      # =========================
      # Create Fox + Egg icon
      # =========================

      - name: Generate Fox Eggs icon
        run: |

          cat > generate_icon.py <<'PY'

          from PIL import Image, ImageDraw

          SIZE = 1024

          img = Image.new(
              "RGBA",
              (SIZE, SIZE),
              (255, 190, 70, 255)
          )

          draw = ImageDraw.Draw(img)

          # Background
          draw.rounded_rectangle(
              (35, 35, 989, 989),
              radius=190,
              fill=(255, 184, 70, 255)
          )

          # Fox head
          draw.polygon(
              [
                  (150, 350),
                  (190, 135),
                  (365, 245),
                  (512, 205),
                  (659, 245),
                  (834, 135),
                  (874, 350),
                  (825, 610),
                  (700, 770),
                  (512, 830),
                  (324, 770),
                  (199, 610)
              ],
              fill=(215, 91, 42, 255)
          )

          # Inner ears
          draw.polygon(
              [
                  (205, 300),
                  (215, 185),
                  (345, 275)
              ],
              fill=(255, 143, 115, 255)
          )

          draw.polygon(
              [
                  (679, 275),
                  (809, 185),
                  (819, 300)
              ],
              fill=(255, 143, 115, 255)
          )

          # White face
          draw.polygon(
              [
                  (512, 400),
                  (430, 455),
                  (390, 590),
                  (425, 700),
                  (512, 755),
                  (599, 700),
                  (634, 590),
                  (594, 455)
              ],
              fill=(255, 239, 211, 255)
          )

          # Eyes
          draw.ellipse(
              (330, 430, 410, 520),
              fill=(35, 25, 20, 255)
          )

          draw.ellipse(
              (614, 430, 694, 520),
              fill=(35, 25, 20, 255)
          )

          # Eye highlights
          draw.ellipse(
              (352, 447, 375, 472),
              fill=(255, 255, 255, 255)
          )

          draw.ellipse(
              (636, 447, 659, 472),
              fill=(255, 255, 255, 255)
          )

          # Nose
          draw.ellipse(
              (468, 555, 556, 625),
              fill=(40, 25, 22, 255)
          )

          # Smile
          draw.arc(
              (420, 575, 604, 720),
              15,
              165,
              fill=(45, 25, 20, 255),
              width=12
          )

          # Egg
          egg = [
              (760, 455),
              (735, 480),
              (720, 530),
              (725, 600),
              (745, 680),
              (780, 755),
              (825, 805),
              (870, 775),
              (900, 710),
              (920, 625),
              (918, 550),
              (900, 490),
              (870, 455),
              (815, 435)
          ]

          draw.polygon(
              egg,
              fill=(255, 250, 232, 255)
          )

          # Egg spots
          draw.ellipse(
              (760, 535, 805, 580),
              fill=(235, 115, 55, 255)
          )

          draw.ellipse(
              (830, 620, 875, 665),
              fill=(235, 115, 55, 255)
          )

          draw.ellipse(
              (785, 700, 825, 740),
              fill=(235, 115, 55, 255)
          )

          # Egg shine
          draw.ellipse(
              (785, 470, 805, 500),
              fill=(255, 255, 255, 220)
          )

          img.save(
              "fox-eggs-icon.png",
              "PNG"
          )

          print("Fox Eggs icon generated successfully.")

          PY

          python3 generate_icon.py

      # =========================
      # Generate Android icons
      # =========================

      - name: Generate Android icons
        run: |

          python3 - <<'PY'

          from PIL import Image
          import os

          source = Image.open(
              "fox-eggs-icon.png"
          ).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          base = "android/app/src/main/res"

          for density, size in sizes.items():

              folder = os.path.join(
                  base,
                  "mipmap-" + density
              )

              os.makedirs(
                  folder,
                  exist_ok=True
              )

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  os.path.join(
                      folder,
                      "ic_launcher.png"
                  ),
                  "PNG"
              )

              icon.save(
                  os.path.join(
                      folder,
                      "ic_launcher_round.png"
                  ),
                  "PNG"
              )

          print("All Android icon sizes generated.")

          PY

      # =========================
      # Remove default Capacitor icons
      # =========================

      - name: Remove default icons
        run: |

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

      # =========================
      # Version
      # =========================

      - name: Set Android version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |

          VERSION_CODE=$((RUN_NUMBER + 100))

          python3 - <<PY

          path = "android/app/build.gradle"

          with open(path, "r") as f:
              text = f.read()

          text = text.replace(
              "versionCode 1",
              "versionCode ${VERSION_CODE}"
          )

          text = text.replace(
              'versionName "1.0.0"',
              'versionName "1.0.${RUN_NUMBER}"'
          )

          with open(path, "w") as f:
              f.write(text)

          PY

      # =========================
      # Keystore
      # =========================

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |

          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore

          test -s FoxEggs.keystore

      - name: Copy Keystore
        run: |

          cp FoxEggs.keystore \
             android/app/FoxEggs.keystore

      # =========================
      # Signing
      # =========================

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |

          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}

          EOF

      - name: Configure release signing
        run: |

          python3 - <<'PY'

          path = "android/app/build.gradle"

          with open(path, "r") as f:
              text = f.read()

          signing = """
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                  }
              }
          """

          if "signingConfigs {" not in text:

              text = text.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          text = text.replace(
              "buildTypes {",
              """buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              """,
              1
          )

          with open(path, "w") as f:
              f.write(text)

          PY

      # =========================
      # Build APK
      # =========================

      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --no-daemon

      # =========================
      # Build AAB
      # =========================

      - name: Build AAB
        working-directory: android
        run: |

          ./gradlew bundleRelease --no-daemon

      # =========================
      # Prepare output
      # =========================

      - name: Prepare release
        run: |

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/FoxEggs.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/FoxEggs.aab

          cp \
            fox-eggs-icon.png \
            release/FoxEggs-Icon.png

      # =========================
      # Upload
      # =========================

      - name: Upload Fox Eggs Release
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-Release
          path: release/
          if-no-files-found: error

      # =========================
      # Cleanup
      # =========================

      - name: Cleanup
        if: always()
        run: |

          rm -f FoxEggs.keystore
          rm -f android/app/FoxEggs.keystore
