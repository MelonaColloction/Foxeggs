name: Build Fox Eggs Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================
      # NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24


      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # ==========================================
      # INSTALL REQUIRED ANDROID PACKAGES
      # ==========================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "Android SDK packages installed successfully."


      # ==========================================
      # PREPARE GAME
      # ==========================================
      - name: Prepare game
        run: |
          test -f index.html
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          echo "Game prepared successfully."


      # ==========================================
      # INJECT CUSTOM WEBSOCKET BRIDGE
      # ==========================================
      # این اسکریپت با پلاگین بومی که در MainActivity ساخته می‌شود صحبت می‌کند
      - name: Inject Custom WebSocket Bridge
        run: |
          python3 - <<'PY'
          path = "www/index.html"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          ws_script = """
          <script>
          // پل ارتباطی با سرور بومی اندروید (LocalWebSocketServer.java)
          window.WebSocketServer = function() {
              this.start = function(port, onSuccess, onError) {
                  if (window.AndroidWebSocketServer) {
                      try {
                          window.AndroidWebSocketServer.startServer(port);
                          if (onSuccess) onSuccess();
                      } catch(e) {
                          if (onError) onError(e.toString());
                      }
                  } else {
                      if (onError) onError("Native WebSocket Server not available");
                  }
              };

              this.send = function(data) {
                  if (window.AndroidWebSocketServer) {
                      window.AndroidWebSocketServer.broadcastMessage(data);
                  }
              };
          };

          // این تابع توسط کد جاوا فراخوانی می‌شود
          window.onNativeMessage = function(msg) {
              if (window.handleNetworkData) {
                  try {
                      const data = JSON.parse(msg);
                      window.handleNetworkData(data);
                  } catch(e) { console.warn('Invalid JSON', e); }
              }
          };
          </script>
          """

          if "<script>\n// پل ارتباطی با سرور بومی اندروید" not in content:
              content = content.replace("</body>", ws_script + "\n</body>")
              print("Custom WebSocket bridge injected.")
          else:
              print("Bridge already exists.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY


      # ==========================================
      # CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          npm install


      # ==========================================
      # CREATE CAPACITOR CONFIG
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www"
          }
          EOF


      # ==========================================
      # ADD ANDROID
      # ==========================================
      - name: Add Android
        run: |
          npx cap add android


      # ==========================================
      # CONFIGURE ANDROID MANIFEST
      # ==========================================
      - name: Configure AndroidManifest
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # 1. Cleartext Traffic
          if 'android:usesCleartextTraffic' not in text:
              text = re.sub(r'<application(\s+)', r'<application\1android:usesCleartextTraffic="true" ', text, count=1)

          # 2. Add Network Permissions
          needed_permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CHANGE_WIFI_MULTICAST_STATE",
              "android.permission.NEARBY_WIFI_DEVICES",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
          ]
          for perm in needed_permissions:
              if perm not in text:
                  text = text.replace("<application", f'<uses-permission android:name="{perm}" />\n    <application', 1)

          # 3. Fix Keyboard Black Screen
          if 'android:windowSoftInputMode="adjustPan"' not in text:
              text = re.sub(
                  r'<activity([^>]*?android:name="\.MainActivity"[^>]*?)>',
                  r'<activity\1 android:windowSoftInputMode="adjustPan">',
                  text
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print("Manifest configured.")
          PY


      # ==========================================
      # ADD JAVA-WEBSOCKET LIBRARY
      # ==========================================
      # این کتابخانه سرور وب‌سوکت واقعی را در اندروید فراهم می‌کند
      - name: Add Java-WebSocket Dependency
        run: |
          python3 - <<'PY'
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "org.java-websocket:Java-WebSocket" not in text:
              # اضافه کردن به بخش dependencies
              text = re.sub(
                  r'(dependencies\s*\{)',
                  r'\1\n    implementation "org.java-websocket:Java-WebSocket:1.5.6"',
                  text,
                  count=1
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print("Java-WebSocket added to build.gradle.")
          else:
              print("Java-WebSocket already exists.")
          PY


      # ==========================================
      # CREATE LOCAL WEBSOCKET SERVER (JAVA)
      # ==========================================
      - name: Create LocalWebSocketServer.java
        run: |
          python3 - <<'PY'
          import os, re
          # پیدا کردن مسیر پکیج اصلی
          base = "android/app/src/main/java"
          pkg_dir = None
          for root, dirs, files in os.walk(base):
              if "MainActivity.java" in files:
                  pkg_dir = root
                  break
          if not pkg_dir:
              raise SystemExit("MainActivity not found")

          # استخراج نام پکیج از فایل MainActivity
          with open(os.path.join(pkg_dir, "MainActivity.java"), "r", encoding="utf-8") as f:
              main_content = f.read()
          package_match = re.search(r'^\s*package\s+([^;]+);', main_content, re.MULTILINE)
          package_name = package_match.group(1)

          java_code = f'''package {package_name};

          import android.webkit.JavascriptInterface;
          import org.java_websocket.WebSocket;
          import org.java_websocket.handshake.ClientHandshake;
          import org.java_websocket.server.WebSocketServer;
          import java.net.InetSocketAddress;
          import java.util.Set;
          import java.util.HashSet;

          public class LocalWebSocketServer {{
              private WebSocketServer server = null;
              private Set<WebSocket> clients = new HashSet<>();
              private android.webkit.WebView webView;

              public LocalWebSocketServer(android.webkit.WebView webView) {{
                  this.webView = webView;
              }}

              @JavascriptInterface
              public void startServer(int port) {{
                  if (server != null) return;
                  try {{
                      server = new WebSocketServer(new InetSocketAddress(port)) {{
                          @Override
                          public void onOpen(WebSocket conn, ClientHandshake handshake) {{
                              clients.add(conn);
                          }}
                          @Override
                          public void onClose(WebSocket conn, int code, String reason, boolean remote) {{
                              clients.remove(conn);
                          }}
                          @Override
                          public void onMessage(WebSocket conn, String message) {{
                              if (webView != null) {{
                                  final String msg = message.replace("\\\\", "\\\\\\\\").replace("'", "\\\\'");
                                  webView.post(() -> webView.evaluateJavascript("window.onNativeMessage('" + msg + "');", null));
                              }}
                          }}
                          @Override
                          public void onError(WebSocket conn, Exception ex) {{ ex.printStackTrace(); }}
                          @Override
                          public void onStart() {{ }}
                      }};
                      server.start();
                  }} catch (Exception e) {{
                      e.printStackTrace();
                  }}
              }}

              @JavascriptInterface
              public void broadcastMessage(String message) {{
                  for (WebSocket client : clients) {{
                      if (client.isOpen()) {{
                          client.send(message);
                      }}
                  }}
              }}
          }}
          '''

          target = os.path.join(pkg_dir, "LocalWebSocketServer.java")
          with open(target, "w", encoding="utf-8") as f:
              f.write(java_code)
          print(f"Created: {target}")
          PY


      # ==========================================
      # MODIFY MAINACTIVITY (FULLSCREEN + WEBSOCKET)
      # ==========================================
      - name: Modify MainActivity
        run: |
          python3 - <<'PY'
          import os, re
          base = "android/app/src/main/java"
          main_activity = None
          for root, dirs, files in os.walk(base):
              if "MainActivity.java" in files:
                  main_activity = os.path.join(root, "MainActivity.java")
                  break
          if not main_activity:
              raise SystemExit("MainActivity.java not found.")

          with open(main_activity, "r", encoding="utf-8") as f:
              original = f.read()

          package_match = re.search(r'^\s*package\s+([^;]+);', original, re.MULTILINE)
          package_name = package_match.group(1)

          new_activity = f'''package {package_name};

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Bridge;

          public class MainActivity extends BridgeActivity {{
              private LocalWebSocketServer wsServer;

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  // Fullscreen
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  // Setup WebSocket Bridge
                  Bridge bridge = getBridge();
                  if (bridge != null && bridge.getWebView() != null) {{
                      WebView webView = bridge.getWebView();
                      wsServer = new LocalWebSocketServer(webView);
                      webView.addJavascriptInterface(wsServer, "AndroidWebSocketServer");
                  }}
              }}
          }}
          '''
          with open(main_activity, "w", encoding="utf-8") as f:
              f.write(new_activity)
          print("MainActivity modified with WebSocket bridge.")
          PY


      # ==========================================
      # SYNC ANDROID
      # ==========================================
      - name: Sync Android
        run: |
          npx cap sync android


      # ==========================================
      # VERSION
      # ==========================================
      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"


      # ==========================================
      # KEYSTORE & SIGNING
      # ==========================================
      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore
          test -s FoxEggs.keystore
          mkdir -p android/app
          cp FoxEggs.keystore android/app/FoxEggs.keystore

      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          cat >> android/gradle.properties <<EOF
          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          EOF


      # ==========================================
      # CONFIGURE ANDROID GRADLE
      # ==========================================
      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          import re, os
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.foxeggs.game"', text, count=1)
          text = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', text, count=1)
          text = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["VERSION_CODE"], text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ["VERSION_NAME"] + '"', text, count=1)

          text = re.sub(r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)', '', text, count=1, flags=re.S)

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          '''
          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1, flags=re.S)

          release_match = re.search(r'(buildTypes\s*\{\s*release\s*\{)(.*?)(\n\s*\})', text, re.S)
          if release_match:
              release_body = release_match.group(2)
              if "minifyEnabled" in release_body:
                  release_body = re.sub(r'minifyEnabled\s+\w+', 'minifyEnabled false', release_body, count=1)
              else:
                  release_body = "\n            minifyEnabled false" + release_body
              text = text[:release_match.start(2)] + release_body + text[release_match.end(2):]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print("Gradle configured.")
          PY


      # ==========================================
      # CLEAN UNNECESSARY PERMISSIONS
      # ==========================================
      - name: Clean unnecessary permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          permissions = [
              "READ_CONTACTS", "WRITE_CONTACTS", "READ_SMS", "SEND_SMS", "RECEIVE_SMS",
              "CALL_PHONE", "READ_PHONE_STATE", "CAMERA", "RECORD_AUDIO",
              "READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE", "MANAGE_EXTERNAL_STORAGE",
              "REQUEST_INSTALL_PACKAGES", "SYSTEM_ALERT_WINDOW", "BIND_ACCESSIBILITY_SERVICE"
          ]
          for permission in permissions:
              pattern = r'\s*<uses-permission\s+android:name="android\.permission\.' + permission + r'"\s*/>'
              text = re.sub(pattern, '', text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print("Permissions cleaned.")
          PY


      # ==========================================
      # INSTALL PILLOW & ICONS
      # ==========================================
      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Find custom game icon
        run: |
          python3 - <<'PY'
          import os
          extensions = (".png", ".jpg", ".jpeg", ".webp")
          files = [f for f in os.listdir(".") if os.path.isfile(f) and f.lower().endswith(extensions)]
          ignored = {"fox-eggs-icon.png", "game-logo.png"}
          files = [f for f in files if f.lower() not in ignored]
          if not files: raise SystemExit("No image found.")
          with open("CUSTOM_ICON", "w") as f: f.write(files[0])
          print(f"Using image: {files[0]}")
          PY

      - name: Generate Android icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os
          with open("CUSTOM_ICON", "r") as f: filename = f.read().strip()
          source = Image.open(filename).convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder + "/ic_launcher.png")
              icon.save(folder + "/ic_launcher_round.png")
          print("Icons generated.")
          PY

      - name: Remove adaptive icon defaults
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml


      # ==========================================
      # BUILD & RELEASE
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Prepare release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/FoxEggs.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/FoxEggs.aab
          cp $(cat CUSTOM_ICON) release/FoxEggs-Icon.png

      - name: Upload Fox Eggs Release
        uses: actions/upload-artifact@v6
        with:
          name: FoxEggs-Release
          path: release/
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          rm -f FoxEggs.keystore
          rm -f android/app/FoxEggs.keystore
