name: Build Fox Eggs Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "Android SDK packages installed successfully."

      # ==========================================
      # PREPARE GAME
      # ==========================================
      - name: Prepare game
        run: |
          test -f index.html
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          echo "Game prepared successfully."

      # ==========================================
      # INJECT WEBSOCKET BRIDGE + MIXED CONTENT FIX
      # ==========================================
      # پل ارتباطی بین JS و سرور بومی + هدایت WebSocket
      # به سمت Native برای هر دو طرف (میزبان و مهمان)
      - name: Inject WebSocket Bridge
        run: |
          python3 - <<'PY'
          path = "www/index.html"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          ws_script = """
          <script>
          // ============================================================
          // پل ارتباطی با سرور بومی جاوا (LocalWebSocketServer.java)
          // ============================================================
          (function() {
              // --- میزبان: شروع سرور بومی ---
              window.WebSocketServer = function() {
                  this.start = function(port, onSuccess, onError) {
                      if (window.AndroidWebSocketServer && window.AndroidWebSocketServer.startServer) {
                          try {
                              window.AndroidWebSocketServer.startServer(port);
                              if (onSuccess) onSuccess();
                          } catch(e) {
                              if (onError) onError(e.toString());
                          }
                      } else {
                          if (onError) onError("Native WebSocket Server not available");
                      }
                  };
                  this.send = function(data) {
                      if (window.AndroidWebSocketServer && window.AndroidWebSocketServer.broadcastMessage) {
                          window.AndroidWebSocketServer.broadcastMessage(data);
                      }
                  };
              };

              // --- مهمان: جایگزینی WebSocket استاندارد با پل بومی ---
              // وقتی مهمان می‌خواهد به ws://IP:PORT وصل شود،
              // به‌جای WebSocket استاندارد (که در WebView
              // با Mixed Content بلاک می‌شود)، از پل بومی استفاده می‌کنیم.
              if (window.AndroidWebSocketServer && window.AndroidWebSocketServer.connectToServer) {
                  const OriginalWebSocket = window.WebSocket;
                  window.WebSocket = function(url, protocols) {
                      // فقط ws:// محلی (192.168.x.x / 10.x.x.x / 172.x.x.x) رو ریدایرکت کن
                      const localMatch = url.match(/^ws:\\/\\/(192\\.168\\.|10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)([^:]+):(\\d+)/);
                      if (localMatch) {
                          const ip = localMatch[2] + localMatch[3];
                          const port = parseInt(localMatch[5], 10);
                          this.readyState = 0;
                          this.onopen = null;
                          this.onmessage = null;
                          this.onerror = null;
                          this.onclose = null;
                          const self = this;
                          window.AndroidWebSocketServer.connectToServer(ip, port,
                              function() {
                                  self.readyState = 1;
                                  if (self.onopen) self.onopen();
                              },
                              function(err) {
                                  self.readyState = 3;
                                  if (self.onerror) self.onerror(new Event('error'));
                              }
                          );
                          this.send = function(data) {
                              if (self.readyState === 1) {
                                  window.AndroidWebSocketServer.sendToServer(data);
                              }
                          };
                          this.close = function() {
                              self.readyState = 3;
                              if (window.AndroidWebSocketServer.closeClient) {
                                  window.AndroidWebSocketServer.closeClient();
                              }
                              if (self.onclose) self.onclose();
                          };
                          return this;
                      }
                      return new OriginalWebSocket(url, protocols);
                  };
                  window.WebSocket.prototype = OriginalWebSocket.prototype;
                  window.WebSocket.CONNECTING = 0;
                  window.WebSocket.OPEN = 1;
                  window.WebSocket.CLOSING = 2;
                  window.WebSocket.CLOSED = 3;
              }

              // --- دریافت پیام از Native (هم میزبان و هم مهمان) ---
              window.onNativeMessage = function(msg) {
                  if (typeof window.__foxNetworkHandler === 'function') {
                      try {
                          window.__foxNetworkHandler(JSON.parse(msg));
                      } catch(e) { console.warn('Invalid JSON from native:', e); }
                  } else if (typeof window.handleNetworkData === 'function') {
                      try {
                          window.handleNetworkData(JSON.parse(msg));
                      } catch(e) { console.warn('Invalid JSON from native:', e); }
                  }
              };

              // --- رویداد باز شدن اتصال مهمان ---
              window.onNativeOpen = function() {
                  if (joinOffline && joinOffline._ws && joinOffline._ws.onopen) {
                      joinOffline._ws.onopen();
                  }
              };
          })();
          </script>
          """

          if "window.WebSocketServer" not in content:
              content = content.replace("</body>", ws_script + "\n</body>")
              print("WebSocket bridge injected.")
          else:
              print("WebSocket bridge already exists.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      # ==========================================
      # CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

      - name: Install dependencies
        run: |
          npm install

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": "www",
            "server": {
              "androidScheme": "http",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      # ==========================================
      # CONFIGURE ANDROID MANIFEST
      # ==========================================
      - name: Configure AndroidManifest
        run: |
          python3 - <<'PY'
          import re

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # 1) cleartext traffic
          if 'android:usesCleartextTraffic' not in text:
              text = re.sub(
                  r'<application(\s+)',
                  r'<application\1android:usesCleartextTraffic="true" ',
                  text,
                  count=1
              )

          # 2) permissions با maxSdkVersion مناسب
          permissions = [
              ("android.permission.INTERNET", None),
              ("android.permission.ACCESS_NETWORK_STATE", None),
              ("android.permission.ACCESS_WIFI_STATE", None),
              ("android.permission.CHANGE_WIFI_MULTICAST_STATE", None),
              ("android.permission.NEARBY_WIFI_DEVICES", 'android:maxSdkVersion="35"'),
              ("android.permission.ACCESS_FINE_LOCATION", 'android:maxSdkVersion="32"'),
              ("android.permission.ACCESS_COARSE_LOCATION", 'android:maxSdkVersion="32"'),
          ]

          for perm, extra in permissions:
              if perm not in text:
                  attr = f' {extra}' if extra else ''
                  text = text.replace(
                      "<application",
                      f'<uses-permission android:name="{perm}"{attr} />\n    <application',
                      1
                  )

          # 3) keyboard fix
          if 'android:windowSoftInputMode="adjustPan"' not in text:
              text = re.sub(
                  r'<activity([^>]*?android:name="\.MainActivity"[^>]*?)>',
                  r'<activity\1 android:windowSoftInputMode="adjustPan">',
                  text
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Manifest configured.")
          PY

      # ==========================================
      # ADD Java-WebSocket DEPENDENCY
      # ==========================================
      - name: Add Java-WebSocket Dependency
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "org.java-websocket:Java-WebSocket" not in text:
              text = re.sub(
                  r'(dependencies\s*\{)',
                  r'\1\n    implementation "org.java-websocket:Java-WebSocket:1.5.6"',
                  text,
                  count=1
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print("Java-WebSocket added.")
          else:
              print("Java-WebSocket already exists.")
          PY

      # ==========================================
      # CREATE LocalWebSocketServer.java (FIXED)
      # ==========================================
      - name: Create LocalWebSocketServer.java
        run: |
          python3 - <<'PY'
          import os, re

          base = "android/app/src/main/java"
          pkg_dir = None
          for root, dirs, files in os.walk(base):
              if "MainActivity.java" in files:
                  pkg_dir = root
                  break
          if not pkg_dir:
              raise SystemExit("MainActivity not found")

          with open(os.path.join(pkg_dir, "MainActivity.java"), "r", encoding="utf-8") as f:
              main_content = f.read()
          package_match = re.search(r'^\s*package\s+([^;]+);', main_content, re.MULTILINE)
          package_name = package_match.group(1)

          java_code = f'''package {package_name};

          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import org.java_websocket.WebSocket;
          import org.java_websocket.handshake.ClientHandshake;
          import org.java_websocket.server.WebSocketServer;

          import org.json.JSONObject;

          import java.net.InetSocketAddress;
          import java.net.URI;
          import java.util.Set;
          import java.util.concurrent.CopyOnWriteArraySet;

          public class LocalWebSocketServer {{

              private WebSocketServer server = null;
              private final Set<WebSocket> clients = new CopyOnWriteArraySet<>();
              private final WebView webView;

              // کلاینت مهمان (برای اتصال به سرور میزبان)
              private org.java_websocket.client.WebSocketClient client = null;

              public LocalWebSocketServer(WebView webView) {{
                  this.webView = webView;
              }}

              // ============================================================
              // میزبان: شروع سرور
              // ============================================================
              @JavascriptInterface
              public void startServer(int port) {{
                  if (server != null) return;
                  try {{
                      server = new WebSocketServer(new InetSocketAddress(port)) {{
                          @Override
                          public void onOpen(WebSocket conn, ClientHandshake handshake) {{
                              clients.add(conn);
                              // به همه اطلاع بده که حریف وصل شد
                              sendToJs("{{\\"type\\":\\"peerConnected\\"}}");
                          }}
                          @Override
                          public void onClose(WebSocket conn, int code, String reason, boolean remote) {{
                              clients.remove(conn);
                              sendToJs("{{\\"type\\":\\"peerDisconnected\\"}}");
                          }}
                          @Override
                          public void onMessage(WebSocket conn, String message) {{
                              sendToJs(message);
                          }}
                          @Override
                          public void onError(WebSocket conn, Exception ex) {{
                              ex.printStackTrace();
                          }}
                          @Override
                          public void onStart() {{ }}
                      }};
                      server.start();
                      sendToJs("{{\\"type\\":\\"serverStarted\\"}}");
                  }} catch (Exception e) {{
                      e.printStackTrace();
                      sendToJs("{{\\"type\\":\\"serverError\\",\\"message\\":\\"" + escapeJson(e.getMessage()) + "\\"}}");
                  }}
              }}

              @JavascriptInterface
              public void broadcastMessage(String message) {{
                  for (WebSocket c : clients) {{
                      if (c.isOpen()) {{
                          try {{ c.send(message); }} catch (Exception e) {{ e.printStackTrace(); }}
                      }}
                  }}
              }}

              // ============================================================
              // مهمان: اتصال به سرور میزبان
              // ============================================================
              @JavascriptInterface
              public void connectToServer(String ip, int port) {{
                  try {{
                      URI uri = new URI("ws://" + ip + ":" + port);
                      client = new org.java_websocket.client.WebSocketClient(uri) {{
                          @Override
                          public void onOpen(org.java_websocket.handshake.ServerHandshake handshake) {{
                              sendToJs("{{\\"type\\":\\"clientOpen\\"}}");
                          }}
                          @Override
                          public void onMessage(String message) {{
                              sendToJs(message);
                          }}
                          @Override
                          public void onClose(int code, String reason, boolean remote) {{
                              sendToJs("{{\\"type\\":\\"clientClosed\\"}}");
                          }}
                          @Override
                          public void onError(Exception ex) {{
                              ex.printStackTrace();
                              sendToJs("{{\\"type\\":\\"clientError\\",\\"message\\":\\"" + escapeJson(ex.getMessage()) + "\\"}}");
                          }}
                      }};
                      client.connect();
                  }} catch (Exception e) {{
                      e.printStackTrace();
                      sendToJs("{{\\"type\\":\\"clientError\\",\\"message\\":\\"" + escapeJson(e.getMessage()) + "\\"}}");
                  }}
              }}

              @JavascriptInterface
              public void sendToServer(String message) {{
                  if (client != null && client.isOpen()) {{
                      try {{ client.send(message); }} catch (Exception e) {{ e.printStackTrace(); }}
                  }}
              }}

              @JavascriptInterface
              public void closeClient() {{
                  if (client != null) {{
                      try {{ client.close(); }} catch (Exception e) {{ e.printStackTrace(); }}
                      client = null;
                  }}
              }}

              // ============================================================
              // ارسال پیام به JS (با escape امن JSON)
              // ============================================================
              private void sendToJs(String json) {{
                  if (webView == null) return;
                  final String safe = JSONObject.quote(json);
                  webView.post(() -> webView.evaluateJavascript(
                      "window.onNativeMessage && window.onNativeMessage(" + safe + ");", null
                  ));
              }}

              private String escapeJson(String s) {{
                  if (s == null) return "";
                  return s.replace("\\\\", "\\\\\\\\").replace("\\"", "\\\\\\"");
              }}
          }}
          '''

          target = os.path.join(pkg_dir, "LocalWebSocketServer.java")
          with open(target, "w", encoding="utf-8") as f:
              f.write(java_code)
          print(f"Created: {target}")
          PY

      # ==========================================
      # MAIN ACTIVITY - FULLSCREEN + BRIDGE
      # ==========================================
      - name: Enable Fullscreen & WebSocket Bridge
        run: |
          python3 - <<'PY'
          import os, re

          base = "android/app/src/main/java"
          main_activity = None
          for root, dirs, files in os.walk(base):
              if "MainActivity.java" in files:
                  main_activity = os.path.join(root, "MainActivity.java")
                  break
          if not main_activity:
              raise SystemExit("MainActivity.java not found.")

          with open(main_activity, "r", encoding="utf-8") as f:
              original = f.read()

          package_match = re.search(r'^\s*package\s+([^;]+);', original, re.MULTILINE)
          package_name = package_match.group(1)

          fullscreen_activity = f'''package {package_name};

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Bridge;

          public class MainActivity extends BridgeActivity {{

              private LocalWebSocketServer wsServer;

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  Bridge bridge = getBridge();
                  if (bridge != null && bridge.getWebView() != null) {{
                      WebView webView = bridge.getWebView();
                      wsServer = new LocalWebSocketServer(webView);
                      webView.addJavascriptInterface(wsServer, "AndroidWebSocketServer");

                      // اجازه Mixed Content (برای ws:// محلی)
                      webView.getSettings().setMixedContentMode(
                          android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      );
                  }}
              }}
          }}
          '''

          with open(main_activity, "w", encoding="utf-8") as f:
              f.write(fullscreen_activity)
          print("MainActivity created.")
          PY

      # ==========================================
      # SYNC + VERSION + SIGNING
      # ==========================================
      - name: Sync Android
        run: |
          npx cap sync android

      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore
          test -s FoxEggs.keystore
          mkdir -p android/app
          cp FoxEggs.keystore android/app/FoxEggs.keystore
          echo "Keystore loaded."

      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          EOF
          echo "Signing configured."

      # ==========================================
      # CONFIGURE GRADLE
      # ==========================================
      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          import re, os
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.foxeggs.game"', text, count=1)
          text = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', text, count=1)
          text = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["VERSION_CODE"], text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ["VERSION_NAME"] + '"', text, count=1)

          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)',
              '', text, count=1, flags=re.S
          )

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

          '''
          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  text, count=1, flags=re.S
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print("Gradle configured.")
          PY

      - name: Show Gradle configuration
        run: cat android/app/build.gradle

      - name: Clean unnecessary permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permissions = [
              "READ_CONTACTS", "WRITE_CONTACTS", "READ_SMS", "SEND_SMS",
              "RECEIVE_SMS", "CALL_PHONE", "READ_PHONE_STATE", "CAMERA",
              "RECORD_AUDIO", "READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE",
              "MANAGE_EXTERNAL_STORAGE", "REQUEST_INSTALL_PACKAGES",
              "SYSTEM_ALERT_WINDOW", "BIND_ACCESSIBILITY_SERVICE"
          ]
          for p in permissions:
              text = re.sub(r'\s*<uses-permission\s+android:name="android\.permission\.' + p + r'"\s*/>', '', text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print("Permissions cleaned.")
          PY

      - name: Verify network permissions
        run: |
          grep -E "uses-permission|usesCleartextTraffic" android/app/src/main/AndroidManifest.xml || true

      # ==========================================
      # ICONS
      # ==========================================
      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Find custom game icon
        run: |
          python3 - <<'PY'
          import os
          exts = (".png", ".jpg", ".jpeg", ".webp")
          files = [f for f in os.listdir(".") if os.path.isfile(f) and f.lower().endswith(exts)]
          ignored = {"fox-eggs-icon.png", "game-logo.png"}
          files = [f for f in files if f.lower() not in ignored]
          if not files:
              raise SystemExit("No image file found.")
          logo = files[0]
          print("Using image:", logo)
          with open("CUSTOM_ICON", "w") as f:
              f.write(logo)
          PY

      - name: Generate Android icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os
          with open("CUSTOM_ICON") as f:
              filename = f.read().strip()
          source = Image.open(filename).convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder + "/ic_launcher.png")
              icon.save(folder + "/ic_launcher_round.png")
          print("Icons generated.")
          PY

      - name: Remove adaptive icon defaults
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon

      - name: Inspect APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          echo "APK FILE:"; ls -lh "$APK"
          echo "SHA256:"; sha256sum "$APK"
          echo "PACKAGE:"; "$AAPT" dump badging "$APK" | head -n 20
          echo "PERMISSIONS:"; "$AAPT" dump permissions "$APK"
          echo "SIGNATURE:"; "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Prepare release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/FoxEggs.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/FoxEggs.aab
          cp "$(cat CUSTOM_ICON)" release/FoxEggs-Icon.png
          echo "Release files prepared."

      - name: Upload Fox Eggs Release
        uses: actions/upload-artifact@v6
        with:
          name: FoxEggs-Release
          path: release/
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          rm -f FoxEggs.keystore
          rm -f android/app/FoxEggs.keystore
