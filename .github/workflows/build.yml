name: Build Fox Eggs APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # دریافت کد
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------
      # نصب Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # -------------------------
      # نصب Java
      # -------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # -------------------------
      # ساخت package.json
      # -------------------------
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fox-eggs",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "sync": "npx cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


      # -------------------------
      # نصب Capacitor
      # -------------------------
      - name: Install Capacitor
        run: npm install


      # -------------------------
      # ساخت تنظیمات Capacitor
      # -------------------------
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.game",
            "appName": "Fox Eggs",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF


      # -------------------------
      # ساخت پروژه Android
      # -------------------------
      - name: Add Android
        run: npx cap add android


      # -------------------------
      # انتقال index.html
      # -------------------------
      - name: Sync web files
        run: npx cap sync android


      # -------------------------
      # نصب Android SDK
      # -------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # -------------------------
      # ساخت APK
      # -------------------------
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      # -------------------------
      # تغییر نام APK
      # -------------------------
      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/FoxEggs.apk


      # -------------------------
      # قرار دادن APK در GitHub
      # -------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-APK
          path: release/FoxEggs.apk
