<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha:false,
        desynchronized:true
    });

let W = 0;
let H = 0;
let scale = 1;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    scale =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );

    canvas.width =
        Math.floor(W * scale);

    canvas.height =
        Math.floor(H * scale);

    ctx.setTransform(
        scale,
        0,
        0,
        scale,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   UI
===================================================== */

const scoreText =
    document.getElementById("score");

const bestText =
    document.getElementById("best");

const comboBox =
    document.getElementById("combo");

const comboValue =
    document.getElementById("comboValue");

const startScreen =
    document.getElementById("startScreen");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const recordText =
    document.getElementById("record");

const startButton =
    document.getElementById("start");

const restartButton =
    document.getElementById("restart");

const menuButton =
    document.getElementById("menuButton");

const menuPanel =
    document.getElementById("menuPanel");

const gamesValue =
    document.getElementById("gamesValue");

const walletBest =
    document.getElementById("walletBest");

const walletEggs =
    document.getElementById("walletEggs");

const walletScore =
    document.getElementById("walletScore");

const finalGames =
    document.getElementById("finalGames");

const finalEggs =
    document.getElementById("finalEggs");


/* =====================================================
   INTERNAL MUSIC
===================================================== */

let audioContext = null;
let musicMaster = null;
let musicTimer = null;
let musicStep = 0;

let soundEnabled =
    localStorage.getItem("foxSound") !== "off";


function initAudio(){

    if(audioContext)
        return;

    const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioCtx)
        return;

    audioContext =
        new AudioCtx();

    musicMaster =
        audioContext.createGain();

    musicMaster.gain.value =
        soundEnabled ? 0.075 : 0;

    musicMaster.connect(
        audioContext.destination
    );
}


function playTone(
    frequency,
    duration,
    type="square",
    volume=.08,
    delay=0
){

    if(!audioContext || !soundEnabled)
        return;

    const now =
        audioContext.currentTime + delay;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    gain.gain.setValueAtTime(
        0,
        now
    );

    gain.gain.linearRampToValueAtTime(
        volume,
        now + .008
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(musicMaster);

    oscillator.start(now);
    oscillator.stop(now + duration + .03);
}


function playKick(){

    if(!audioContext || !soundEnabled)
        return;

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "sine";

    oscillator.frequency.setValueAtTime(
        120,
        now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        45,
        now + .12
    );

    gain.gain.setValueAtTime(
        .12,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + .14
    );

    oscillator.connect(gain);
    gain.connect(musicMaster);

    oscillator.start(now);
    oscillator.stop(now + .15);
}


function playHat(){

    if(!audioContext || !soundEnabled)
        return;

    const buffer =
        audioContext.createBuffer(
            1,
            audioContext.sampleRate * .035,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){

        data[i] =
            Math.random() * 2 - 1;
    }

    const source =
        audioContext.createBufferSource();

    const gain =
        audioContext.createGain();

    gain.gain.value =
        .025;

    source.buffer =
        buffer;

    source.connect(gain);
    gain.connect(musicMaster);

    source.start();
}


const melody = [
    523.25,
    659.25,
    783.99,
    659.25,
    587.33,
    698.46,
    880.00,
    698.46,

    523.25,
    659.25,
    783.99,
    987.77,
    880.00,
    783.99,
    659.25,
    587.33
];


function musicTick(){

    if(!playing)
        return;

    if(!soundEnabled)
        return;

    const note =
        melody[musicStep % melody.length];

    playTone(
        note,
        .17,
        "square",
        .055
    );

    if(musicStep % 2 === 0)
        playHat();

    if(musicStep % 4 === 0)
        playKick();

    if(musicStep % 8 === 7){

        playTone(
            note / 2,
            .28,
            "triangle",
            .035,
            .02
        );
    }

    musicStep++;
}


/*
=====================================================
FIXED START MUSIC

مهم‌ترین اصلاح همین بخش است.

بعد از Game Over، ولوم موسیقی صفر می‌شود.
در شروع بازی بعدی دوباره آن را به 0.075 برمی‌گردانیم.
=====================================================
*/

function startMusic(){

    initAudio();

    if(!audioContext || !musicMaster)
        return;

    if(audioContext.state === "suspended"){

        audioContext.resume();
    }

    /*
      برگرداندن صدای موسیقی بعد از Game Over
    */

    musicMaster.gain.cancelScheduledValues(
        audioContext.currentTime
    );

    musicMaster.gain.setTargetAtTime(
        soundEnabled ? 0.075 : 0,
        audioContext.currentTime,
        0.03
    );

    /*
      جلوگیری از اجرای چند تایمر موسیقی
      همزمان با هم
    */

    stopMusicTimer();

    /*
      آهنگ هر بار از اول شروع می‌شود
    */

    musicStep = 0;

    /*
      اولین نت بلافاصله پخش شود
    */

    if(soundEnabled){

        musicTick();
    }

    /*
      ادامه آهنگ
    */

    musicTimer =
        setInterval(
            musicTick,
            190
        );
}


function stopMusicTimer(){

    if(musicTimer){

        clearInterval(
            musicTimer
        );

        musicTimer = null;
    }
}


function stopMusic(){

    stopMusicTimer();

    if(musicMaster && audioContext){

        musicMaster.gain.cancelScheduledValues(
            audioContext.currentTime
        );

        musicMaster.gain.setTargetAtTime(
            0,
            audioContext.currentTime,
            0.03
        );
    }
}


function enableSound(){

    soundEnabled = true;

    localStorage.setItem(
        "foxSound",
        "on"
    );

    initAudio();

    if(musicMaster && audioContext){

        musicMaster.gain.cancelScheduledValues(
            audioContext.currentTime
        );

        musicMaster.gain.setTargetAtTime(
            .075,
            audioContext.currentTime,
            .04
        );
    }

    if(playing){

        startMusic();
    }

    updateSoundButtons();
}


function disableSound(){

    soundEnabled = false;

    localStorage.setItem(
        "foxSound",
        "off"
    );

    stopMusic();

    updateSoundButtons();
}


function updateSoundButtons(){

    const onButton =
        document.getElementById(
            "soundOnButton"
        );

    const offButton =
        document.getElementById(
            "soundOffButton"
        );

    if(language === "fa"){

        onButton.textContent =
            soundEnabled
            ? "🔊 روشن ✓"
            : "🔊 روشن";

        offButton.textContent =
            !soundEnabled
            ? "🔇 خاموش ✓"
            : "🔇 خاموش";

    }else{

        onButton.textContent =
            soundEnabled
            ? "🔊 On ✓"
            : "🔊 On";

        offButton.textContent =
            !soundEnabled
            ? "🔇 Off ✓"
            : "🔇 Off";
    }
}


/* =====================================================
   SAFE LOCAL STORAGE
===================================================== */

function loadNumber(key, defaultValue = 0){

    try{

        const value =
            localStorage.getItem(key);

        if(value === null){

            localStorage.setItem(
                key,
                String(defaultValue)
            );

            return defaultValue;
        }

        const number =
            Number(value);

        if(Number.isFinite(number))
            return number;

        localStorage.setItem(
            key,
            String(defaultValue)
        );

        return defaultValue;

    }catch(error){

        return defaultValue;
    }
}


function saveWallet(){

    try{

        localStorage.setItem(
            "foxBest",
            String(best)
        );

        localStorage.setItem(
            "foxGames",
            String(gamesPlayed)
        );

        localStorage.setItem(
            "foxEggs",
            String(totalEggs)
        );

        localStorage.setItem(
            "foxTotalScore",
            String(totalScore)
        );

    }catch(error){

        console.warn(
            "Could not save wallet data",
            error
        );
    }
}


/* =====================================================
   PERMANENT DATA
===================================================== */

let best =
    loadNumber("foxBest");

let gamesPlayed =
    loadNumber("foxGames");

let totalEggs =
    loadNumber("foxEggs");

let totalScore =
    loadNumber("foxTotalScore");


/* =====================================================
   LANGUAGE
===================================================== */

let language =
    localStorage.getItem("foxLanguage") || "fa";


function applyLanguage(){

    const fa =
        language === "fa";

    document.documentElement.lang =
        fa ? "fa" : "en";

    document.documentElement.dir =
        fa ? "rtl" : "ltr";


    document.getElementById(
        "menuTitle"
    ).textContent =
        fa ? "منو" : "Menu";


    document.getElementById(
        "languageTitle"
    ).textContent =
        fa ? "زبان" : "Language";


    document.getElementById(
        "soundTitle"
    ).textContent =
        fa ? "صدا" : "Sound";


    document.getElementById(
        "gamesLabel"
    ).textContent =
        fa ? "تعداد بازی‌ها" : "Games played";


    document.getElementById(
        "bestLabel"
    ).textContent =
        fa ? "رکورد" : "Best score";


    document.getElementById(
        "eggsLabel"
    ).textContent =
        fa
        ? "کل تخم‌های جمع‌شده"
        : "Total eggs collected";


    document.getElementById(
        "walletScoreLabel"
    ).textContent =
        fa
        ? "امتیاز کل"
        : "Total score";


    document.getElementById(
        "startText"
    ).textContent =
        fa
        ? "تخم‌ها را جمع کن و رکورد بزن!"
        : "Collect eggs and beat your record!";


    startButton.textContent =
        fa
        ? "شروع بازی"
        : "Start Game";


    document.getElementById(
        "controlText"
    ).textContent =
        fa
        ? "لمس صفحه یا Space برای پرش"
        : "Tap the screen or press Space to jump";


    document.getElementById(
        "gameOverTitle"
    ).textContent =
        fa
        ? "باختی!"
        : "Game Over";


    document.getElementById(
        "finalScoreLabel"
    ).textContent =
        fa ? "امتیاز:" : "Score:";


    document.getElementById(
        "gameCountLabel"
    ).textContent =
        fa
        ? "تعداد بازی‌ها:"
        : "Games:";


    document.getElementById(
        "totalEggLabel"
    ).textContent =
        fa
        ? "کل تخم‌ها:"

    restartButton.textContent =

function setLanguage(lang){

    language = lang;

    localStorage.setItem(
        "foxLanguage",
        lang
    );

    applyLanguage();

    menuPanel.style.display =
        "none";
}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(){

    const fa =
        language === "fa";


    scoreText.textContent =
        fa
        ? "امتیاز: " + score
        : "Score: " + score;


    bestText.textContent =
        fa
        ? "رکورد: " + best
        : "Best: " + best;


    gamesValue.textContent =
        gamesPlayed;

    walletBest.textContent =
        best;

    walletEggs.textContent =
        totalEggs;

    walletScore.textContent =
        totalScore;

    finalGames.textContent =
        gamesPlayed;

    finalEggs.textContent =
        totalEggs;
}


/* =====================================================
   GAME STATE
===================================================== */

let playing = false;

let score = 0;

let speed = 330;

let lastTime = 0;

let eggTimer = 0;

let obstacleTimer = 1;

let combo = 0;

let comboTimer = 0;

let eggs = [];

let obstacles = [];


/* =====================================================
   SPEED SYSTEM
===================================================== */

function updateSpeed(){

    if(score <= 600){

        const progress =
            Math.max(
                0,
                Math.min(
                    score / 600,
                    1
                )
            );

        const smooth =
            progress *
            progress *
            (3 - 2 * progress);

        speed =
            330 +
            870 * smooth;

    }else{

        speed =
            1200 +
            (score - 600) * .12;
    }
}


/* =====================================================
   DAY / NIGHT
===================================================== */

let isNight = false;

let lastDayCycle = -1;


function updateDayNight(){

    const cycle =
        Math.floor(score / 100);

    isNight =
        cycle % 2 === 1;

    if(cycle !== lastDayCycle){

        lastDayCycle = cycle;
    }
}


/* =====================================================
   GROUND
===================================================== */

function ground(){

    return H * .72;
}


/* =====================================================
   FOX
===================================================== */

const fox = {

    x:100,

    y:0,

    w:62,

    h:48,

    vy:0,

    gravity:2100,

    jump:-780,

    grounded:true,

    animation:0

};


function resetFox(){

    fox.x =
        Math.max(
            70,
            W * .14
        );

    fox.y =
        ground() - fox.h;

    fox.vy = 0;

    fox.grounded = true;

    fox.animation = 0;
}


/* =====================================================
   EGG TYPES
===================================================== */

const eggTypes = [

    ["#ffffff",1],

    ["#45d46b",2],

    ["#3498db",5],

    ["#a855f7",10],

    ["#ffd43b",25]

];


/* =====================================================
   CREATE EGG
===================================================== */

function createEgg(){

    let r =
        Math.random();

    let type = 0;

    if(r > .55)
        type = 1;

    if(r > .78)
        type = 2;

    if(r > .91)
        type = 3;

    if(r > .98)
        type = 4;

    const data =
        eggTypes[type];


    eggs.push({

        x:W + 30,

        y:
            ground()
            - 50
            - Math.random() * 130,

        w:25,

        h:34,

        color:data[0],

        value:data[1]

    });
}


/* =====================================================
   CREATE OBSTACLE
===================================================== */

function createObstacle(){

    const r =
        Math.random();

    let type;

    if(r < .45)
        type = "tree";

    else if(r < .75)
        type = "rock";

    else
        type = "cactus";


    let w = 45;
    let h = 65;


    if(type === "rock"){

        w = 55;
        h = 40;
    }


    if(type === "cactus"){

        w = 32;
        h = 62;
    }


    obstacles.push({

        x:W + 40,

        y:ground() - h,

        w:w,

        h:h,

        type:type

    });
}


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

    return(

        a.x + 8 <
        b.x + b.w &&

        a.x + a.w - 8 >
        b.x &&

        a.y + 7 <
        b.y + b.h &&

        a.y + a.h - 5 >
        b.y

    );
}


/* =====================================================
   JUMP
===================================================== */

function jump(){

    if(!playing)
        return;

    if(fox.grounded){

        fox.vy =
            fox.jump;

        fox.grounded =
            false;
    }
}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

    if(isNight){

        ctx.fillStyle =
            "#101b3d";

    }else{

        ctx.fillStyle =
            "#87ceeb";
    }


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    if(isNight){

        ctx.fillStyle =
            "#f5f3ce";

        ctx.beginPath();

        ctx.arc(
            W - 90,
            90,
            28,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "rgba(255,255,255,.8)";

        for(let i=0;i<22;i++){

            const x =
                (i * 83 + 37) %
                Math.max(W,1);

            const y =
                35 +
                (i * 47) %
                Math.max(H * .45,1);

            ctx.fillRect(
                x,
                y,
                2,
                2
            );
        }

    }else{

        ctx.fillStyle =
            "#ffe082";

        ctx.beginPath();

        ctx.arc(
            W - 90,
            90,
            35,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "rgba(255,255,255,.65)";

        drawCloud(
            120,
            100,
            1
        );

        drawCloud(
            W * .55,
            145,
            .7
        );

        drawCloud(
            W * .85,
            80,
            .8
        );
    }


    const gy =
        ground();


    ctx.fillStyle =
        isNight
        ? "#31542c"
        : "#7dbb4b";


    ctx.fillRect(
        0,
        gy,
        W,
        H - gy
    );


    ctx.fillStyle =
        isNight
        ? "#253f23"
        : "#55963b";


    ctx.fillRect(
        0,
        gy,
        W,
        5
    );
}


function drawCloud(x,y,s){

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        20 * s,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 25 * s,
        y - 8 * s,
        27 * s,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 52 * s,
        y,
        20 * s,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =====================================================
   DRAW FOX
===================================================== */

function drawFox(){

    const x = fox.x;
    const y = fox.y;

    const running =
        fox.grounded
        ? Math.sin(fox.animation) * 4
        : 0;


    ctx.fillStyle =
        "rgba(0,0,0,.15)";

    ctx.beginPath();

    ctx.ellipse(
        x + 30,
        ground() + 3,
        28,
        6,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#f97316";

    ctx.beginPath();

    ctx.moveTo(
        x + 15,
        y + 28
    );

    ctx.quadraticCurveTo(
        x - 22,
        y + 5 + running,
        x - 10,
        y - 10 + running
    );

    ctx.quadraticCurveTo(
        x + 5,
        y + 5,
        x + 20,
        y + 23
    );

    ctx.fill();


    ctx.fillStyle =
        "#fff7ed";

    ctx.beginPath();

    ctx.moveTo(
        x - 10,
        y - 10 + running
    );

    ctx.quadraticCurveTo(
        x - 25,
        y,
        x - 14,
        y + 12
    );

    ctx.quadraticCurveTo(
        x - 5,
        y + 5,
        x + 1,
        y + 7
    );

    ctx.fill();


    ctx.fillStyle =
        "#f97316";

    ctx.beginPath();

    ctx.ellipse(
        x + 29,
        y + 29,
        27,
        18,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#fff7ed";

    ctx.beginPath();

    ctx.ellipse(
        x + 34,
        y + 31,
        14,
        10,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#ea580c";

    ctx.fillRect(
        x + 14,
        y + 39 + running,
        10,
        11
    );

    ctx.fillRect(
        x + 39,
        y + 39 - running,
        10,
        11
    );


    ctx.fillStyle =
        "#f97316";

    ctx.beginPath();

    ctx.ellipse(
        x + 43,
        y + 18,
        16,
        17,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#fb923c";

    ctx.beginPath();

    ctx.ellipse(
        x + 52,
        y + 8,
        21,
        17,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#f97316";

    ctx.beginPath();

    ctx.moveTo(
        x + 38,
        y - 3
    );

    ctx.lineTo(
        x + 39,
        y - 20
    );

    ctx.lineTo(
        x + 50,
        y - 6
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x + 53,
        y - 4
    );

    ctx.lineTo(
        x + 62,
        y - 19
    );

    ctx.lineTo(
        x + 68,
        y
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#fecaca";

    ctx.beginPath();

    ctx.moveTo(
        x + 41,
        y - 6
    );

    ctx.lineTo(
        x + 41,
        y - 14
    );

    ctx.lineTo(
        x + 47,
        y - 7
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#fff7ed";

    ctx.beginPath();

    ctx.ellipse(
        x + 67,
        y + 13,
        12,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        x + 75,
        y + 10,
        3.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x + 58,
        y + 5,
        3.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.arc(
        x + 59,
        y + 4,
        1.2,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =====================================================
   DRAW EGG
===================================================== */

function drawEgg(e){

    const cx =
        e.x + e.w / 2;


    if(e.value >= 10){

        ctx.shadowBlur = 10;

        ctx.shadowColor =
            e.color;
    }


    ctx.fillStyle =
        e.color;


    ctx.beginPath();

    ctx.moveTo(
        cx,
        e.y
    );


    ctx.bezierCurveTo(
        e.x + e.w,
        e.y + 5,
        e.x + e.w,
        e.y + 23,
        cx,
        e.y + e.h
    );


    ctx.bezierCurveTo(
        e.x,
        e.y + 23,
        e.x,
        e.y + 5,
        cx,
        e.y
    );


    ctx.fill();

    ctx.shadowBlur = 0;


    ctx.strokeStyle =
        "rgba(0,0,0,.12)";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(
        e.x + 6,
        e.y + 18
    );


    ctx.quadraticCurveTo(
        cx,
        e.y + 12,
        e.x + e.w - 6,
        e.y + 18
    );

    ctx.stroke();
}


/* =====================================================
   DRAW OBSTACLE
===================================================== */

function drawObstacle(o){

    if(o.type === "tree"){

        ctx.fillStyle =
            "#8b5a2b";

        ctx.fillRect(
            o.x + 16,
            o.y + 27,
            14,
            o.h - 27
        );


        ctx.fillStyle =
            "#23823c";

        ctx.beginPath();

        ctx.arc(
            o.x + 23,
            o.y + 20,
            25,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "#2f9e44";

        ctx.beginPath();

        ctx.arc(
            o.x + 7,
            o.y + 32,
            16,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            o.x + 40,
            o.y + 32,
            16,
            0,
            Math.PI * 2
        );

        ctx.fill();


    }else if(o.type === "rock"){

        ctx.fillStyle =
            "#667085";

        ctx.beginPath();

        ctx.moveTo(
            o.x,
            o.y + o.h
        );

        ctx.lineTo(
            o.x + 10,
            o.y + 10
        );

        ctx.lineTo(
            o.x + 28,
            o.y
        );

        ctx.lineTo(
            o.x + o.w,
            o.y + 15
        );

        ctx.lineTo(
            o.x + o.w - 8,
            o.y + o.h
        );

        ctx.closePath();

        ctx.fill();


    }else{

        ctx.fillStyle =
            "#25834a";

        ctx.fillRect(
            o.x + 9,
            o.y,
            14,
            o.h
        );

        ctx.fillRect(
            o.x,
            o.y + 20,
            13,
            11
        );

        ctx.fillRect(
            o.x + 20,
            o.y + 38,
            13,
            11
        );
    }
}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

    updateSpeed();


    /* FOX */

    fox.vy +=
        fox.gravity * dt;

    fox.y +=
        fox.vy * dt;


    if(
        fox.y + fox.h >= ground()
    ){

        fox.y =
            ground() - fox.h;

        fox.vy = 0;

        fox.grounded = true;
    }


    fox.animation +=
        dt * 15;


    /* DAY / NIGHT */

    updateDayNight();


    /* EGGS */

    eggTimer -= dt;


    if(eggTimer <= 0){

        createEgg();

        eggTimer =
            .55 +
            Math.random() * .4;
    }


    for(
        let i = eggs.length - 1;
        i >= 0;
        i--
    ){

        const e =
            eggs[i];

        e.x -=
            speed * dt;


        if(collision(fox,e)){

            collectEgg(e);

            eggs.splice(
                i,
                1
            );

            continue;
        }


        if(e.x < -60){

            eggs.splice(
                i,
                1
            );
        }
    }


    /* OBSTACLES */

    obstacleTimer -= dt;


    if(obstacleTimer <= 0){

        createObstacle();

        obstacleTimer =
            1.05 +
            Math.random() * .55;
    }


    for(
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ){

        const o =
            obstacles[i];

        o.x -=
            speed * dt;


        if(collision(fox,o)){

            endGame();

            return;
        }


        if(o.x < -80){

            obstacles.splice(
                i,
                1
            );
        }
    }


    /* COMBO */

    if(combo > 0){

        comboTimer -= dt;


        if(comboTimer <= 0){

            combo = 0;

            comboBox.classList.remove(
                "show"
            );
        }
    }
}


/* =====================================================
   COLLECT EGG
===================================================== */

function collectEgg(e){

    combo++;

    comboTimer = 2;


    let multiplier = 1;


    if(combo >= 10){

        multiplier = 3;

    }else if(combo >= 5){

        multiplier = 2;
    }


    const earned =
        e.value * multiplier;


    score += earned;

    totalEggs += 1;

    totalScore += earned;


    saveWallet();

    updateSpeed();

    updateDayNight();

    updateUI();


    if(combo >= 2){

        comboBox.classList.add(
            "show"
        );

        comboValue.textContent =
            combo;
    }
}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

    if(!playing)
        return;


    let dt =
        (time - lastTime) / 1000;


    lastTime = time;


    if(dt > .033)
        dt = .033;


    update(dt);

    draw();


    if(playing){

        requestAnimationFrame(
            loop
        );
    }
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    drawBackground();


    for(const e of eggs){

        drawEgg(e);
    }


    for(const o of obstacles){

        drawObstacle(o);
    }


    drawFox();
}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    /*
      اگر یک اجرای قبلی موسیقی هنوز باقی مانده،
      اول کاملاً متوقفش می‌کنیم.
    */

    stopMusicTimer();

    score = 0;

    speed = 330;

    eggTimer = .3;

    obstacleTimer = 1;

    combo = 0;

    comboTimer = 0;

    eggs.length = 0;

    obstacles.length = 0;

    lastDayCycle = -1;

    isNight = false;


    gamesPlayed++;

    saveWallet();

    updateUI();


    comboBox.classList.remove(
        "show"
    );


    resetFox();


    playing = true;


    menuButton.style.display =
        "none";

    menuPanel.style.display =
        "none";


    startScreen.style.display =
        "none";

    gameOver.style.display =
        "none";


    /*
      موسیقی هر بار که بازی شروع می‌شود
      از ابتدای آهنگ پخش خواهد شد.
    */

    startMusic();


    lastTime =
        performance.now();


    requestAnimationFrame(
        loop
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    playing = false;

    /*
      موسیقی متوقف می‌شود.
    */

    stopMusic();


    finalScore.textContent =
        score;


    if(score > best){

        best = score;

        recordText.style.display =
            "block";

        saveWallet();

    }else{

        recordText.style.display =
            "none";
    }


    updateUI();


    menuButton.style.display =
        "block";


    gameOver.style.display =
        "flex";
}


/* =====================================================
   INPUT
===================================================== */

function handleInput(){

    if(!playing){

        startGame();

    }else{

        jump();
    }
}


window.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            handleInput();
        }
    }
);


canvas.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        handleInput();

    },
    {
        passive:false
    }
);


startButton.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        startGame();
    }
);


restartButton.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        startGame();
    }
);


/* =====================================================
   SOUND BUTTONS
===================================================== */

document.getElementById(
    "soundOnButton"
).addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        enableSound();
    }
);


document.getElementById(
    "soundOffButton"
).addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        disableSound();
    }
);


/* =====================================================
   MENU
===================================================== */

menuButton.addEventListener(
    "click",
    function(e){

        e.stopPropagation();


        if(playing)
            return;


        menuPanel.style.display =
            menuPanel.style.display === "block"
            ? "none"
            : "block";


        updateUI();
    }
);


menuPanel.addEventListener(
    "click",
    function(e){

        e.stopPropagation();
    }
);


document.getElementById(
    "faButton"
).addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        setLanguage("fa");
    }
);


document.getElementById(
    "enButton"
).addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        setLanguage("en");
    }
);


/* =====================================================
   INITIAL
===================================================== */

applyLanguage();

updateUI();

resetFox();

menuButton.style.display =
    "block";

draw();

</script>
